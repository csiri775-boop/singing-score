<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let cache=[];

window.login = function(){

  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value.trim();

  if(u==="admin" && p==="admin1"){

    // 🔥 ซ่อน login จริง ๆ
    document.getElementById("loginWrapper").classList.add("hidden");

    // แสดงระบบ
    document.getElementById("appBox").style.display="block";

  }else{
    alert("❌ รหัสไม่ถูกต้อง");
  }
};

// เพิ่ม
window.addContestant=async()=>{
let name=newName.value.trim();
if(!name) return alert("ใส่ชื่อ");
await addDoc(collection(db,"contestants"),{
name:name,totalScore:0,j1:0,j2:0,j3:0});
newName.value="";
};

// ลบ
window.deleteContestant=async()=>{
let id=contestant.value;
if(!confirm("ลบ?")) return;
await deleteDoc(doc(db,"contestants",id));
};

// IMPORT EXCEL
window.importExcel = function(){

  const file = excelFile.files[0];
  if(!file) return alert("เลือกไฟล์");

  const reader = new FileReader();

  reader.onload = async function(e){

    const text = new TextDecoder("utf-8").decode(e.target.result);
    let rows = text.split("\n");

    let list = [];

    for(let i=1;i<rows.length;i++){
      let cols = rows[i].split(",");

      let no = Number(cols[0]);
      let name = cols[1]?.trim();

      if(name){
        list.push({no, name});
      }
    }

    // 🔥 เรียงตามเลข
    list.sort((a,b)=>a.no - b.no);

    // 🔥 เพิ่มเข้า Firebase
    for(let item of list){
      await addDoc(collection(db,"contestants"),{
        name: `No.${item.no} ${item.name}`,
        order: item.no,
        totalScore:0,
        j1:0,j2:0,j3:0
      });
    }

    alert("นำเข้าเรียงลำดับแล้ว");
  };

  reader.readAsArrayBuffer(file);
};

// คะแนน
const items = [
  {name:"น้ำเสียง",max:30},
  {name:"เทคนิค",max:10},
  {name:"จังหวะ",max:20},
  {name:"อักขระ",max:10},
  {name:"บุคลิก",max:10},
  {name:"ความยาก",max:10},
  {name:"แต่งกาย",max:10}
];

window.announceResult = function(){
  if(cache.length === 0){
    alert("ยังไม่มีข้อมูล");
    return;
  }

  let sorted = [...cache]
    .sort((a,b)=>(b.totalScore||0)-(a.totalScore||0));

  // หาคะแนนที่ซ้ำกัน: ผู้ประกวดทุกคนที่อยู่ในกลุ่มคะแนนเดียวกัน
  // จะถูกแสดงชื่อสีแดงและขีดเส้นใต้
  const scoreCount = {};
  sorted.forEach(c=>{
    const score = Number(c.totalScore || 0);
    scoreCount[score] = (scoreCount[score] || 0) + 1;
  });

  let hasTie = Object.values(scoreCount).some(n => n > 1);

  let html = `
  <html>
  <head>
  <meta charset="UTF-8">
  <style>
    @page { size: A4; margin: 20mm; }
    body{
      font-family:"TH Sarabun New",sans-serif;
      text-align:center;
    }
    h1{
      font-size:36px;
      margin-bottom:10px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }
    th,td{
      border:1px solid #000;
      padding:8px;
      font-size:20px;
    }
    th{background:#f0f0f0;}
    .top1{background:gold;font-weight:bold;}
    .top2{background:#ddd;}
    .top3{background:#cd7f32;color:white;}
    @keyframes tieBlinkRed {
      0%, 49% {
        color: red !important;
        opacity: 1;
      }
      50%, 100% {
        color: red !important;
        opacity: 0.15;
      }
    }

    .tie-name,
    .tie-rank,
    .tie-score{
      color:red !important;
      text-decoration:underline !important;
      text-decoration-thickness:2px;
      text-underline-offset:3px;
      font-weight:bold;
      animation: tieBlinkRed 1s steps(1, end) infinite;
    }
    .tie-note{
      color:red;
      font-weight:bold;
      text-decoration:underline;
      font-size:20px;
      margin:8px 0;
    }
  


/* ===== COMPACT INDEX UI ===== */
#formArea{
  margin-top:4px;
}
#formArea h3{
  margin:8px 0 4px;
}
#formArea table{
  margin-top:0;
  margin-bottom:4px;
}
#formArea + button{
  margin-top:4px;
}
.contestant-tools{
  margin-bottom:4px;
}


.judge-spacer{
  height:4px;
}

</style>
  </head>
  <body>
  <h1>🏆 ผลการประกวดร้องเพลง</h1>
  ${hasTie ? '<div class="tie-note">หมายเหตุ: อันดับ + รายชื่อ + คะแนน ที่เป็นสีแดงกระพิบและขีดเส้นใต้ = คะแนนเสมอกัน</div>' : ''}
  <table>
    <tr>
      <th>อันดับ</th>
      <th>ชื่อผู้เข้าแข่งขัน</th>
      <th>คะแนนรวม</th>
    </tr>
  `;

  sorted.forEach((c,i)=>{
    let cls="";
    if(i===0) cls="top1";
    else if(i===1) cls="top2";
    else if(i===2) cls="top3";

    const score = Number(c.totalScore || 0);
    const tie = scoreCount[score] > 1;
    const nameClass = tie ? "tie-name" : "";

    html += `
      <tr class="${cls}">
        <td class="${tie ? "tie-rank" : ""}">อันดับที่ ${i+1}</td>
        <td class="${nameClass}">${escapeHtml(c.name)}</td>
        <td class="${tie ? "tie-score" : ""}">${score}</td>
      </tr>
    `;
  });

  html += `
    </table>
  </body>
  </html>
  `;

  let w = window.open("");
  if(!w){
    alert("กรุณาอนุญาต Pop-up เพื่อเปิดหน้าประกาศผล");
    return;
  }
  w.document.write(html);
  w.document.close();
  setTimeout(()=>w.print(),500);
};

// FORM
function createForm(){
let html="";
for(let j=1;j<=3;j++){
html+=`<h3>กรรมการ ${j}</h3><table><tr>`;
items.forEach(i=>html+=`<th>${i.name}(${i.max})</th>`);
html+=`</tr><tr>`;
items.forEach((i,idx)=>{
  html+=`<td>
    <input type="number" id="j${j}_s${idx}" data-j="${j}" data-i="${idx}">
  </td>`;
});
html+=`</tr></table><div class="judge-spacer"></div>`;
}
formArea.innerHTML=html;

// auto focus
// // ❌ ไม่เด้งอัตโนมัติอีกต่อไป
setTimeout(()=>{
  let inputs = document.querySelectorAll("input[type=number]");

  inputs.forEach((el,i)=>{

    // กด Enter → ไปช่องถัดไป (แทน auto)
    el.addEventListener("keydown",(e)=>{
      if(e.key==="Enter"){
        e.preventDefault();
        if(inputs[i+1]) inputs[i+1].focus();
      }
    });

  });

},300);

}
createForm();

// LOAD
async function loadContestants() {
  const snapshot = await getDocs(collection(db, "contestants"));
  const select = document.getElementById("contestant");

  let list = [];

  snapshot.forEach(docSnap => {
    const data = docSnap.data();

    list.push({
      id: docSnap.id,
      name: data.name,
      order: data.order || 9999,
      locked: data.locked || false   // ✅ เพิ่มตัวนี้
    });
  });

  // 🔥 เรียงตามเลข
  list.sort((a, b) => a.order - b.order);

  // 🔥 ล้างก่อน
  select.innerHTML = "";

  list.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.text = item.name;

    // ✅ สีเขียวถ้ากรอกแล้ว
    if (item.locked) {
      opt.style.color = "green";
      opt.text += " ✔";
    }

    select.appendChild(opt);
  });
}

// CALC
function calc(p){
  let arr=[], sum=0;

  for(let i=0;i<items.length;i++){

    let el = document.querySelector(`[id="${p}_s${i}"]`);

    if(!el){
      console.log("❌ ไม่เจอ:", p+"_s"+i);
      arr.push(0);
      continue;
    }

    if(el.value === ""){
      alert(`กรุณากรอกคะแนนให้ครบ: ${p.toUpperCase()} / ${items[i].name}`);
      el.focus();
      throw "incomplete";
    }

    let v = Number(el.value);

    if(!Number.isFinite(v) || v < 0){
      alert(`คะแนนไม่ถูกต้อง: ${p.toUpperCase()} / ${items[i].name}`);
      el.focus();
      throw "invalid";
    }

    if(v > items[i].max){
      alert("เกิน "+items[i].max);
      throw "err";
    }

    arr.push(v);
    sum += v;
  }

  console.log("✅", p, arr);

  return {arr,sum};
}

// SAVE
let pendingScoreSave = null;

window.submitScore = async () => {
  let id = contestant.value;
  if(!id) return alert("กรุณาเลือกผู้ประกวด");

  let c = cache.find(x => x.id === id);
  if(!c) return alert("ไม่พบข้อมูลผู้ประกวด");

  if(c.locked){
    if(!confirm("ผู้ประกวดรายนี้บันทึกคะแนนแล้ว\nต้องการแก้ไขและบันทึกคะแนนใหม่หรือไม่?")) return;
  }

  try{
    let j1 = calc("j1");
    let j2 = calc("j2");
    let j3 = calc("j3");

    pendingScoreSave = {
      id,
      name: c.name,
      order: c.order || 9999,
      j1, j2, j3,
      total: j1.sum + j2.sum + j3.sum
    };

    const previewHead = document.getElementById("savePreviewHead");
    const previewTable = document.getElementById("savePreviewTable");
    const previewModal = document.getElementById("savePreviewModal");

    if(!previewHead || !previewTable || !previewModal){
      throw new Error("ไม่พบหน้าต่างตรวจสอบข้อมูลก่อนบันทึก");
    }

    previewHead.innerHTML =
      `<span><b>หมายเลข:</b> No.${pendingScoreSave.order}</span>
       <span><b>ชื่อผู้ประกวด:</b> ${escapeHtml(pendingScoreSave.name)}</span>`;

    previewTable.innerHTML = `
      <thead>
        <tr>
          <th>รายการ</th>
          <th>เต็ม</th>
          <th>กรรมการ 1</th>
          <th>กรรมการ 2</th>
          <th>กรรมการ 3</th>
        </tr>
      </thead>
      <tbody>
        ${items.map((it,idx)=>`
          <tr>
            <td>${escapeHtml(it.name)}</td>
            <td>${it.max}</td>
            <td>${pendingScoreSave.j1.arr[idx]}</td>
            <td>${pendingScoreSave.j2.arr[idx]}</td>
            <td>${pendingScoreSave.j3.arr[idx]}</td>
          </tr>
        `).join("")}
        <tr class="preview-total">
          <td colspan="2">รวมกรรมการ</td>
          <td>${pendingScoreSave.j1.sum}</td>
          <td>${pendingScoreSave.j2.sum}</td>
          <td>${pendingScoreSave.j3.sum}</td>
        </tr>
        <tr class="preview-total">
          <td colspan="4">คะแนนรวมทั้งหมด</td>
          <td>${pendingScoreSave.total}</td>
        </tr>
      </tbody>
    `;

    previewModal.style.display = "flex";
  }catch(e){
    console.error(e);
  }
};

window.closeSavePreview = function(){
  pendingScoreSave = null;
  document.getElementById("savePreviewModal").style.display = "none";
};

window.confirmSaveScore = async function(){
  if(!pendingScoreSave) return;

  const p = pendingScoreSave;
  const btn = document.querySelector('#savePreviewModal button[onclick="confirmSaveScore()"]');
  if(btn) btn.disabled = true;

  try{
    await updateDoc(doc(db,"contestants",p.id),{
      score1:p.j1.arr,
      score2:p.j2.arr,
      score3:p.j3.arr,
      j1:p.j1.sum,
      j2:p.j2.sum,
      j3:p.j3.sum,
      totalScore:p.total,
      locked:true
    });

    // จำลำดับผู้ประกวดคนถัดไปก่อนโหลดข้อมูลใหม่
    const orderedContestants = [...cache].sort((a,b)=>(a.order||9999)-(b.order||9999));
    const currentIndex = orderedContestants.findIndex(x => x.id === p.id);
    const nextContestant = currentIndex >= 0 ? orderedContestants[currentIndex + 1] : null;

    pendingScoreSave = null;
    document.getElementById("savePreviewModal").style.display = "none";
    clearScore();
    await loadContestants();

    // เลื่อนไปผู้ประกวดคนถัดไปโดยอัตโนมัติ
    const select = document.getElementById("contestant");
    if(nextContestant && select){
      select.value = nextContestant.id;
    }

    setTimeout(()=>{
      const first = document.getElementById("j1_s0");
      if(first) first.focus();
    },200);

    alert(nextContestant
      ? `✅ บันทึกข้อมูลเรียบร้อยแล้ว\n➡️ เลื่อนไป ${nextContestant.name} อัตโนมัติ`
      : "✅ บันทึกข้อมูลเรียบร้อยแล้ว\n🎉 เป็นผู้ประกวดคนสุดท้าย");
  }catch(err){
    console.error(err);
    alert("❌ ไม่สามารถบันทึกข้อมูลได้\n"+err.message);
  } finally {
    if(btn) btn.disabled = false;
  }
};

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

// CLEAR
window.clearScore=()=>{
document.querySelectorAll("input[type=number]").forEach(i=>i.value="");
};

// BACKUP
window.backupData=()=>{
let blob=new Blob([JSON.stringify(cache)]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.json";
a.click();
};

// ===== RESTORE BACKUP =====
let pendingRestoreData = null;

window.selectBackupFile = function(){
  const input = document.getElementById("backupFile");
  const modal = document.getElementById("restoreModal");

  if(!input || !modal){
    alert("ระบบเรียกคืน Backup ยังไม่พร้อม");
    return;
  }

  input.value = "";
  document.getElementById("restorePreviewContent").innerHTML =
    "<p style='text-align:center;'>กำลังรอเลือกไฟล์ Backup...</p>";
  document.getElementById("restoreConfirmBtn").disabled = true;
  modal.classList.add("show");
  input.click();
};

window.restoreBackup = function(event){
  const file = event?.target?.files?.[0];

  if(!file){
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const list = Array.isArray(parsed) ? parsed :
                   Array.isArray(parsed.contestants) ? parsed.contestants : null;

      if(!list) throw new Error("รูปแบบไฟล์ Backup ไม่ถูกต้อง");

      pendingRestoreData = list;

      const preview = list.slice(0,20);
      let html = `
        <p><b>พบข้อมูล ${list.length} คน</b>
        ${list.length > 20 ? " (แสดงตัวอย่าง 20 คนแรก)" : ""}</p>
        <table class="preview-table">
          <tr>
            <th>ลำดับ</th>
            <th>หมายเลข</th>
            <th>ชื่อผู้ประกวด</th>
            <th>กก.1</th>
            <th>กก.2</th>
            <th>กก.3</th>
            <th>รวม</th>
          </tr>
      `;

      preview.forEach((c,i)=>{
        html += `
          <tr>
            <td>${i+1}</td>
            <td>No.${c.order ?? (i+1)}</td>
            <td>${escapeHtml(c.name || "")}</td>
            <td>${Number(c.j1 || 0)}</td>
            <td>${Number(c.j2 || 0)}</td>
            <td>${Number(c.j3 || 0)}</td>
            <td><b>${Number(c.totalScore || 0)}</b></td>
          </tr>
        `;
      });

      html += `</table>
        <p style="color:#b00000;font-weight:bold;text-align:center;">
          ⚠️ การเรียกคืนจะลบข้อมูลผู้ประกวดปัจจุบันทั้งหมดก่อนนำข้อมูลจาก Backup เข้าแทนที่
        </p>`;

      document.getElementById("restorePreviewContent").innerHTML = html;
      document.getElementById("restoreConfirmBtn").disabled = false;
      document.getElementById("restoreModal").classList.add("show");

    }catch(err){
      pendingRestoreData = null;
      document.getElementById("restoreConfirmBtn").disabled = true;
      document.getElementById("restorePreviewContent").innerHTML =
        `<p style="color:red;font-weight:bold;">❌ ${escapeHtml(err.message)}</p>`;
      document.getElementById("restoreModal").classList.add("show");
    }
  };

  reader.onerror = function(){
    pendingRestoreData = null;
    document.getElementById("restoreConfirmBtn").disabled = true;
    alert("❌ ไม่สามารถอ่านไฟล์ Backup ได้");
  };

  reader.readAsText(file, "utf-8");
};

window.closeRestoreModal = function(){
  pendingRestoreData = null;
  const input = document.getElementById("backupFile");
  if(input) input.value = "";
  document.getElementById("restoreModal").classList.remove("show");
};

document.getElementById("backupFile").addEventListener("change", restoreBackup);

window.confirmRestoreBackup = async function(){
  if(!pendingRestoreData || !pendingRestoreData.length){
    return alert("ไม่พบข้อมูลสำหรับเรียกคืน");
  }

  if(!confirm(
    "ยืนยันเรียกคืนข้อมูลจากไฟล์ Backup?\n\n"+
    "ข้อมูลผู้ประกวดปัจจุบันทั้งหมดจะถูกลบ และแทนที่ด้วยข้อมูลจาก Backup"
  )) return;

  try{
    const snap = await getDocs(collection(db,"contestants"));

    for(const d of snap.docs){
      await deleteDoc(doc(db,"contestants",d.id));
    }

    for(const item of pendingRestoreData){
      const clean = {...item};
      delete clean.id;

      // รองรับ backup ที่มีข้อมูลเก่า/ไม่ครบ
      clean.name = clean.name || "";
      clean.order = Number(clean.order ?? 9999);
      clean.totalScore = Number(clean.totalScore || 0);
      clean.j1 = Number(clean.j1 || 0);
      clean.j2 = Number(clean.j2 || 0);
      clean.j3 = Number(clean.j3 || 0);
      clean.score1 = Array.isArray(clean.score1) ? clean.score1 : [];
      clean.score2 = Array.isArray(clean.score2) ? clean.score2 : [];
      clean.score3 = Array.isArray(clean.score3) ? clean.score3 : [];
      clean.locked = Boolean(clean.locked);

      await addDoc(collection(db,"contestants"), clean);
    }

    const restoredCount = pendingRestoreData.length;
    closeRestoreModal();
    alert(`✅ เรียกคืนข้อมูลสำเร็จ ${restoredCount} คน`);
  }catch(err){
    console.error(err);
    alert("❌ เรียกคืนข้อมูลไม่สำเร็จ\n"+err.message);
  }
};

backupData();

const snap=await getDocs(collection(db,"contestants"));

await deleteDoc(doc(db,"contestants",d.id));

alert("ล้างแล้ว");

// TABLE
onSnapshot(collection(db,"contestants"),snap=>{

  cache=[];
  let list=[];
  let done = 0;

  snap.forEach(d=>{
    const data = d.data();

    if(data.locked) done++;   // 🔥 นับคนที่ให้คะแนนแล้ว

    list.push({
  id:d.id,
  name:data.name,
  order:data.order || 9999,
  totalScore:data.totalScore||0,
  locked:data.locked || false,

  // 🔥 เพิ่มตรงนี้
  score1: data.score1 || [],
  score2: data.score2 || [],
  score3: data.score3 || [],
  j1: data.j1 || 0,
  j2: data.j2 || 0,
  j3: data.j3 || 0
});
  });

  // 🔥 เรียง No.
  list.sort((a,b)=>a.order - b.order);

  // 🔥 แสดงสถานะ
  document.getElementById("statusBox").innerHTML =
    `📊 ให้คะแนนแล้ว <b>${done}</b> / ${list.length} คน`;

  // 🔥 dropdown
  contestant.innerHTML="";
  list.forEach(item=>{
    let o=document.createElement("option");
    o.value=item.id;
    o.text=item.name;

    if(item.locked){
      o.text += " ✔";
      o.style.color="green";
    }

    contestant.appendChild(o);
  });

  // ตารางคะแนนในหน้า index ถูกนำออกแล้ว
  // ยังคง cache สำหรับรายงานและประกาศผล
  cache=[...list];
  cache.sort((a,b)=>(b.totalScore||0)-(a.totalScore||0));
});

// ✅ REPORT (แก้แล้ว)
window.printDetail = function(){

  if(cache.length===0){
    alert("ยังไม่มีข้อมูล");
    return;
  }

  let html = `
  <html>
  <head>
  <meta charset="UTF-8">
  <style>
    @page{
      size:A4 portrait;
      margin:8mm;
    }
    *{box-sizing:border-box;}
    html,body{
      width:100%;
      margin:0;
      padding:0;
      font-family:sans-serif;
    }
    .page{
      page-break-after:always;
      width:100%;
    }
    .box{
      width:100%;
      display:block;
      border:1px solid #000;
      margin:0 0 4px 0;
      padding:3px 5px;
      font-size:11px;
      page-break-inside:avoid;
    }
    .box table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:10px;
      margin:0;
    }
    .box td,.box th{
      border:1px solid #000;
      padding:2px 3px;
      text-align:center;
    }
    .box td:first-child,
    .box th:first-child{
      width:32%;
      text-align:left;
    }
    .box td:not(:first-child),
    .box th:not(:first-child){
      width:17%;
    }
  </style>
  </head>
  <body>
  `;

  cache.forEach((c,i)=>{

    if(i % 10 === 0){
      html += `<div class="page">`;
    }

    html+=`
    <div class="box">
    <b>No.${i+1} ${c.name}</b>

    <table>
    <tr>
      <th>รายการ</th>
      <th>เต็ม</th>
      <th>กก1</th>
      <th>กก2</th>
      <th>กก3</th>
    </tr>`;

    items.forEach((it,idx)=>{
      html+=`
      <tr>
        <td>${it.name}</td>
        <td>${it.max}</td>
        <td>${c.score1?.[idx]||0}</td>
        <td>${c.score2?.[idx]||0}</td>
        <td>${c.score3?.[idx]||0}</td>
      </tr>`;
    });

    html+=`
    <tr>
      <td colspan="2"><b>รวม</b></td>
      <td><b>${c.j1||0}</b></td>
      <td><b>${c.j2||0}</b></td>
      <td><b>${c.j3||0}</b></td>
    </tr>

    <tr>
      <td colspan="5"><b>รวมทั้งหมด ${c.totalScore||0}</b></td>
    </tr>

    </table>
    </div>
    `;

    if((i+1)%10===0){
      html += `</div>`;
    }
  });

  if(cache.length % 10 !== 0){
    html += `</div>`;
  }

  html+="</body></html>";

  let w=window.open("");
  w.document.write(html);
  w.document.close();

  setTimeout(()=>w.print(),500);
};
