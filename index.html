<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let cache=[];

// เก็บ ID ผู้ประกวดคนถัดไปที่ต้องการเลือกหลังยืนยันบันทึก
let pendingNextContestantId = null;

// ===== ADMIN SESSION =====
const ADMIN_SESSION_KEY = "singingContestAdminSession";

// Developer account: ห้ามลบ ห้ามปิดใช้งาน และห้ามแก้ไขจากหน้า Admin
const DEVELOPER_USERNAME = "sirichai";
const DEVELOPER_PASSWORD = "Sb270887";
const DEVELOPER_ROLE = "developer";

let currentAdmin = null;

window.login = async function(){
  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value;

  if(!u || !p){
    alert("กรุณากรอก Username และ Password");
    return;
  }

  try{
    const snap = await getDocs(collection(db,"admins"));
    let found = null;

    snap.forEach(d=>{
      const a=d.data();
      if(String(a.username||"").trim()===u &&
         String(a.password||"")===p &&
         a.active!==false){
        found={id:d.id,username:a.username};
      }
    });

    // บัญชีผู้พัฒนาระบบถ้ายังไม่มี ให้สร้างอัตโนมัติ
    // รองรับการย้ายบัญชีเดิม admin/admin1 -> sirichai/Sb270887
    if(!found){
      let developerDoc = null;
      let oldAdminDoc = null;

      snap.forEach(d=>{
        const a=d.data();
        const username=String(a.username||"").trim().toLowerCase();

        if(username === DEVELOPER_USERNAME.toLowerCase()){
          developerDoc = {id:d.id, data:a};
        }

        if(username === "admin"){
          oldAdminDoc = {id:d.id, data:a};
        }
      });

      if(!developerDoc && (snap.empty || oldAdminDoc)){
        const targetId = oldAdminDoc ? oldAdminDoc.id : null;
        const targetRef = targetId
          ? doc(db,"admins",targetId)
          : doc(collection(db,"admins"));

        await setDoc(targetRef,{
          username:DEVELOPER_USERNAME,
          password:DEVELOPER_PASSWORD,
          active:true,
          role:DEVELOPER_ROLE,
          protected:true,
          createdAt:oldAdminDoc?.data?.createdAt || new Date().toISOString()
        });

        found={id:targetRef.id,username:DEVELOPER_USERNAME,role:DEVELOPER_ROLE,protected:true};
      }
    }

    if(!found){
      alert("❌ Username หรือ Password ไม่ถูกต้อง หรือบัญชีถูกปิดใช้งาน");
      return;
    }

    currentAdmin={
      id:found.id,
      username:found.username,
      role:found.role || "admin",
      protected:found.protected === true || String(found.role||"") === DEVELOPER_ROLE
    };

    localStorage.setItem(ADMIN_SESSION_KEY,JSON.stringify({
      id:currentAdmin.id,
      username:currentAdmin.username,
      role:currentAdmin.role,
      protected:currentAdmin.protected,
      loginAt:Date.now()
    }));
    showLoggedIn();
  }catch(err){
    console.error(err);
    alert("❌ ไม่สามารถตรวจสอบบัญชีแอดมินได้\n"+err.message);
  }
};

function showLoggedIn(){
  document.getElementById("loginWrapper").classList.add("hidden");
  document.getElementById("appBox").style.display="block";
  const label=document.getElementById("adminUserLabel");
  if(label) label.textContent=`👤 แอดมิน: ${currentAdmin?.username || "admin"}`;
}

function showLoggedOut(){
  currentAdmin=null;
  document.getElementById("loginWrapper").classList.remove("hidden");
  document.getElementById("appBox").style.display="none";
  document.getElementById("adminUserLabel").textContent="👤 ผู้ดูแลระบบ";
}

window.openAdminPage = function(){ window.location.assign("./admin.html"); };

window.logout=function(){
  if(!confirm("ยืนยันล็อกเอาท์ออกจากระบบ?")) return;
  localStorage.removeItem(ADMIN_SESSION_KEY);
  showLoggedOut();
  document.getElementById("user").value="";
  document.getElementById("pass").value="";
};

window.toggleAdminPanel=function(){
};

async function restoreAdminSession(){
  const raw=localStorage.getItem(ADMIN_SESSION_KEY);
  if(!raw) return;

  try{
    const saved=JSON.parse(raw);
    if(!saved?.id || !saved?.username) throw new Error("invalid session");

    const snap=await getDocs(collection(db,"admins"));
    let valid=false;
    snap.forEach(d=>{
      const a=d.data();
      if(d.id===saved.id &&
         String(a.username||"")===String(saved.username) &&
         a.active!==false){
        valid=true;
        currentAdmin={
          id:d.id,
          username:a.username,
          role:a.role || "admin",
          protected:a.protected === true || String(a.role||"") === DEVELOPER_ROLE
        };
      }
    });

    if(valid) showLoggedIn();
    else{
      localStorage.removeItem(ADMIN_SESSION_KEY);
      showLoggedOut();
    }
  }catch(err){
    console.error("restoreAdminSession:",err);
    localStorage.removeItem(ADMIN_SESSION_KEY);
    showLoggedOut();
  }
}

// ===== ADMIN MANAGEMENT =====
window.loadAdmins=async function(){
  const body=document.getElementById("adminListBody");
  if(!body) return;
  body.innerHTML='<tr><td colspan="3">กำลังโหลด...</td></tr>';

  try{
    const snap=await getDocs(collection(db,"admins"));
    if(snap.empty){
      body.innerHTML='<tr><td colspan="3">ยังไม่มีบัญชีแอดมิน</td></tr>';
      return;
    }

    const admins=[];
    snap.forEach(d=>{
      const a=d.data();
      admins.push({
        id:d.id,
        username:String(a.username||""),
        active:a.active!==false,
        role:String(a.role||"admin"),
        protected:a.protected===true
      });
    });
    admins.sort((a,b)=>a.username.localeCompare(b.username));

    body.innerHTML=admins.map(a=>{
      const isDeveloper =
        a.protected === true ||
        String(a.role || "").toLowerCase() === DEVELOPER_ROLE ||
        a.username.toLowerCase() === DEVELOPER_USERNAME.toLowerCase();

      return `
      <tr>
        <td class="${isDeveloper ? "admin-protected" : ""}">
          ${escapeHtml(a.username)}
          ${isDeveloper ? " 🛡️ ผู้พัฒนาระบบ" : ""}
        </td>
        <td class="${isDeveloper ? "admin-status-developer" : (a.active?"admin-status-active":"admin-status-disabled")}">
          ${isDeveloper ? "ใช้งานถาวร" : (a.active?"ใช้งาน":"ปิดใช้งาน")}
        </td>
        <td>
          ${
            isDeveloper
              ? '<span class="admin-protected">🔒 ห้ามลบ / ห้ามแก้ไข</span>'
              : `
                <button onclick="toggleAdminStatus('${a.id}',${a.active})">
                  ${a.active?"🔒 ปิดใช้งาน":"🔓 เปิดใช้งาน"}
                </button>
                <button onclick="deleteAdmin('${a.id}','${escapeJs(a.username)}')" style="background:#d32f2f;">
                  🗑️ ลบ
                </button>
              `
          }
        </td>
      </tr>`;
    }).join("");
  }catch(err){
    console.error(err);
    body.innerHTML='<tr><td colspan="3" style="color:red;">โหลดรายชื่อแอดมินไม่สำเร็จ</td></tr>';
  }
};

window.addAdmin=async function(){
  const username=document.getElementById("adminNewUsername").value.trim();
  const password=document.getElementById("adminNewPassword").value;

  if(!username || !password) return alert("กรุณากรอกชื่อแอดมินและรหัสผ่าน");
  if(password.length<4) return alert("รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร");

  try{
    const snap=await getDocs(collection(db,"admins"));
    let duplicate=false;
    snap.forEach(d=>{
      if(String(d.data().username||"").toLowerCase()===username.toLowerCase()) duplicate=true;
    });
    if(duplicate) return alert("❌ มีชื่อแอดมินนี้อยู่แล้ว");

    // ไม่อนุญาตให้สร้างบัญชีอื่นด้วยชื่อผู้พัฒนา
    if(username.toLowerCase() === DEVELOPER_USERNAME.toLowerCase()){
      return alert("❌ ชื่อ sirichai สงวนไว้สำหรับผู้พัฒนาระบบ");
    }

    await addDoc(collection(db,"admins"),{
      username,
      password,
      active:true,
      role:"admin",
      protected:false,
      createdAt:new Date().toISOString()
    });

    document.getElementById("adminNewUsername").value="";
    document.getElementById("adminNewPassword").value="";
    await loadAdmins();
    alert("✅ เพิ่มแอดมินเรียบร้อยแล้ว");
  }catch(err){
    console.error(err);
    alert("❌ เพิ่มแอดมินไม่สำเร็จ\n"+err.message);
  }
};

window.toggleAdminStatus=async function(id,active){
  if(currentAdmin && id===currentAdmin.id)
    return alert("ไม่สามารถปิดใช้งานบัญชีที่กำลังล็อกอินอยู่ได้");

  try{
    const target=await getDoc(doc(db,"admins",id));
    if(target.exists()){
      const a=target.data();
      if(a.protected===true ||
         String(a.role||"").toLowerCase()===DEVELOPER_ROLE ||
         String(a.username||"").toLowerCase()===DEVELOPER_USERNAME.toLowerCase()){
        return alert("🔒 บัญชีผู้พัฒนาระบบห้ามแก้ไขหรือปิดใช้งาน");
      }
    }
    await updateDoc(doc(db,"admins",id),{active:!active});
    await loadAdmins();
  }catch(err){
    console.error(err);
    alert("❌ เปลี่ยนสถานะแอดมินไม่สำเร็จ\n"+err.message);
  }
};

window.deleteAdmin=async function(id,username){
  if(currentAdmin && id===currentAdmin.id)
    return alert("ไม่สามารถลบบัญชีแอดมินที่กำลังล็อกอินอยู่ได้");

  try{
    const target=await getDoc(doc(db,"admins",id));
    if(target.exists()){
      const a=target.data();
      if(a.protected===true ||
         String(a.role||"").toLowerCase()===DEVELOPER_ROLE ||
         String(a.username||"").toLowerCase()===DEVELOPER_USERNAME.toLowerCase()){
        return alert("🔒 บัญชีผู้พัฒนาระบบห้ามลบหรือแก้ไข");
      }
    }

    if(!confirm(`ยืนยันลบแอดมิน "${username}" ?`)) return;

    await deleteDoc(doc(db,"admins",id));
    await loadAdmins();
    alert("✅ ลบแอดมินเรียบร้อยแล้ว");
  }catch(err){
    console.error(err);
    alert("❌ ลบแอดมินไม่สำเร็จ\n"+err.message);
  }

window.importExcel = function(){

  const file = excelFile.files[0];
  if(!file) return alert("เลือกไฟล์");

  const reader = new FileReader();

  reader.onload = async function(e){

    const text = new TextDecoder("utf-8").decode(e.target.result);
    let rows = text.split("\n");

    let list = [];

    for(let i=1;i<rows.length;i++){
      let cols = rows[i].split(",");

      let no = Number(cols[0]);
      let name = cols[1]?.trim();

      if(name){
        list.push({no, name});
      }
    }

    // 🔥 เรียงตามเลข
    list.sort((a,b)=>a.no - b.no);

    // 🔥 เพิ่มเข้า Firebase
    for(let item of list){
      await addDoc(collection(db,"contestants"),{
        name: `No.${item.no} ${item.name}`,
        order: item.no,
        totalScore:0,
        j1:0,j2:0,j3:0
      });
    }

    alert("นำเข้าเรียงลำดับแล้ว");
  };

  reader.readAsArrayBuffer(file);
};

async function loadContestants() {
  const snapshot = await getDocs(collection(db, "contestants"));
  const select = document.getElementById("contestant");

  let list = [];

  snapshot.forEach(docSnap => {
    const data = docSnap.data();

    list.push({
      id: docSnap.id,
      name: data.name,
      order: data.order || 9999,
      locked: data.locked || false   // ✅ เพิ่มตัวนี้
    });
  });

  // 🔥 เรียงตามเลข
  list.sort((a, b) => a.order - b.order);

  // 🔥 ล้างก่อน
  select.innerHTML = "";

  list.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.text = item.name;

    // ✅ สีเขียวถ้ากรอกแล้ว
    if (item.locked) {
      opt.style.color = "green";
      opt.text += " ✔";
    }

    select.appendChild(opt);
  });
}

// CALC
function calc(p){
  let arr=[], sum=0;

  for(let i=0;i<items.length;i++){

    let el = document.querySelector(`[id="${p}_s${i}"]`);

    if(!el){
      console.log("❌ ไม่เจอ:", p+"_s"+i);
      arr.push(0);
      continue;
    }

    if(el.value === ""){
      alert(`กรุณากรอกคะแนนให้ครบ: ${p.toUpperCase()} / ${items[i].name}`);
      el.focus();
      throw "incomplete";
    }

    let v = Number(el.value);

    if(!Number.isFinite(v) || v < 0){
      alert(`คะแนนไม่ถูกต้อง: ${p.toUpperCase()} / ${items[i].name}`);
      el.focus();
      throw "invalid";
    }

    if(v > items[i].max){
      alert("เกิน "+items[i].max);
      throw "err";
    }

    arr.push(v);
    sum += v;
  }

  console.log("✅", p, arr);

  return {arr,sum};
}

window.confirmSaveScore = async function(){

  const p = pendingScoreSave;
  const btn = document.querySelector('#savePreviewModal button[onclick="confirmSaveScore()"]');
  if(btn) btn.disabled = true;

  // หาผู้ประกวดคนถัดไปจากลำดับหมายเลข "ก่อน" บันทึก
  // ไม่อ้างอิงตำแหน่งของ option ใน dropdown เพราะ option อาจถูกสร้างใหม่โดย onSnapshot
  const orderedContestants = [...cache].sort(
    (a,b)=>(Number(a.order ?? 9999) - Number(b.order ?? 9999))
  );

  const currentIndex = orderedContestants.findIndex(x => x.id === p.id);
  const nextContestant =
    currentIndex >= 0 && currentIndex + 1 < orderedContestants.length
      ? orderedContestants[currentIndex + 1]
      : null;

  try{
    // สำคัญ: ตั้งค่า "คนถัดไป" ก่อน updateDoc
    // เพราะ updateDoc จะทำให้ onSnapshot ทำงานและสร้าง dropdown ใหม่
    pendingNextContestantId = nextContestant ? nextContestant.id : null;

    await updateDoc(doc(db,"contestants",p.id),{
      score1:p.j1.arr,
      score2:p.j2.arr,
      score3:p.j3.arr,
      j1:p.j1.sum,
      j2:p.j2.sum,
      j3:p.j3.sum,
      totalScore:p.total,
      locked:true
    });

    pendingScoreSave = null;
    document.getElementById("savePreviewModal").style.display = "none";
    clearScore();

    // ไม่เรียก loadContestants() ที่นี่
    // เพราะ onSnapshot จะโหลดข้อมูลล่าสุดจาก Firebase ให้อัตโนมัติ
    // และจะเลือก pendingNextContestantId ให้เอง

    const targetName = nextContestant ? nextContestant.name : "";

    setTimeout(()=>{
      const first = document.getElementById("j1_s0");
      if(first) first.focus();
    },250);

    alert(nextContestant
      ? `✅ บันทึกข้อมูลเรียบร้อยแล้ว\n➡️ เลื่อนไป ${targetName} อัตโนมัติ`
      : "✅ บันทึกข้อมูลเรียบร้อยแล้ว\n🎉 เป็นผู้ประกวดคนสุดท้าย");

  }catch(err){
    // ถ้าบันทึกไม่สำเร็จ ต้องไม่ค้างค่าเป้าหมายคนถัดไป
    pendingNextContestantId = null;
    console.error(err);
    alert("❌ ไม่สามารถบันทึกข้อมูลได้\n"+err.message);

  } finally {
    if(btn) btn.disabled = false;
  }
};

window.restoreBackup = function(event){
  const file = event?.target?.files?.[0];

  if(!file){
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const list = Array.isArray(parsed) ? parsed :
                   Array.isArray(parsed.contestants) ? parsed.contestants : null;

      if(!list) throw new Error("รูปแบบไฟล์ Backup ไม่ถูกต้อง");

      pendingRestoreData = list;

      const preview = list.slice(0,20);
      let html = `
        <p><b>พบข้อมูล ${list.length} คน</b>
        ${list.length > 20 ? " (แสดงตัวอย่าง 20 คนแรก)" : ""}</p>
        <table class="preview-table">
          <tr>
            <th>ลำดับ</th>
            <th>หมายเลข</th>
            <th>ชื่อผู้ประกวด</th>
            <th>กก.1</th>
            <th>กก.2</th>
            <th>กก.3</th>
            <th>รวม</th>
          </tr>
      `;

      preview.forEach((c,i)=>{
        html += `
          <tr>
            <td>${i+1}</td>
            <td>No.${c.order ?? (i+1)}</td>
            <td>${escapeHtml(c.name || "")}</td>
            <td>${Number(c.j1 || 0)}</td>
            <td>${Number(c.j2 || 0)}</td>
            <td>${Number(c.j3 || 0)}</td>
            <td><b>${Number(c.totalScore || 0)}</b></td>
          </tr>
        `;
      });

      html += `</table>
        <p style="color:#b00000;font-weight:bold;text-align:center;">
          ⚠️ การเรียกคืนจะลบข้อมูลผู้ประกวดปัจจุบันทั้งหมดก่อนนำข้อมูลจาก Backup เข้าแทนที่
        </p>`;

      document.getElementById("restorePreviewContent").innerHTML = html;
      document.getElementById("restoreConfirmBtn").disabled = false;
      document.getElementById("restoreModal").classList.add("show");

    }catch(err){
      pendingRestoreData = null;
      document.getElementById("restoreConfirmBtn").disabled = true;
      document.getElementById("restorePreviewContent").innerHTML =
        `<p style="color:red;font-weight:bold;">❌ ${escapeHtml(err.message)}</p>`;
      document.getElementById("restoreModal").classList.add("show");
    }
  };

  reader.onerror = function(){
    pendingRestoreData = null;
    document.getElementById("restoreConfirmBtn").disabled = true;
    alert("❌ ไม่สามารถอ่านไฟล์ Backup ได้");
  };

  reader.readAsText(file, "utf-8");
};

    return alert("ไม่พบข้อมูลสำหรับเรียกคืน");
  }

  if(!confirm(
    "ยืนยันเรียกคืนข้อมูลจากไฟล์ Backup?\n\n"+
    "ข้อมูลผู้ประกวดปัจจุบันทั้งหมดจะถูกลบ และแทนที่ด้วยข้อมูลจาก Backup"

  try{
    const snap = await getDocs(collection(db,"contestants"));

    for(const d of snap.docs){
      await deleteDoc(doc(db,"contestants",d.id));
    }

    for(const item of pendingRestoreData){
      const clean = {...item};
      delete clean.id;

      // รองรับ backup ที่มีข้อมูลเก่า/ไม่ครบ

      clean.j1 = Number(clean.j1 || 0);
      clean.j2 = Number(clean.j2 || 0);
      clean.j3 = Number(clean.j3 || 0);

      clean.score2 = Array.isArray(clean.score2) ? clean.score2 : [];
      clean.score3 = Array.isArray(clean.score3) ? clean.score3 : [];
      clean.locked = Boolean(clean.locked);

      await addDoc(collection(db,"contestants"), clean);
    }

    const restoredCount = pendingRestoreData.length;
    closeRestoreModal();
    alert(`✅ เรียกคืนข้อมูลสำเร็จ ${restoredCount} คน`);

};

// TABLE
onSnapshot(collection(db,"contestants"),snap=>{

  cache=[];
  let list=[];
  let done = 0;

  snap.forEach(d=>{
    const data = d.data();

    if(data.locked) done++;   // 🔥 นับคนที่ให้คะแนนแล้ว

    list.push({
  id:d.id,
  name:data.name,
  order:data.order || 9999,
  totalScore:data.totalScore||0,
  locked:data.locked || false,

  // 🔥 เพิ่มตรงนี้
  score1: data.score1 || [],
  score2: data.score2 || [],
  score3: data.score3 || [],
  j1: data.j1 || 0,
  j2: data.j2 || 0,
  j3: data.j3 || 0
});
  });

  // 🔥 เรียง No.
  list.sort((a,b)=>a.order - b.order);

  // 🔥 แสดงสถานะ
  document.getElementById("statusBox").innerHTML =
    `📊 ให้คะแนนแล้ว <b>${done}</b> / ${list.length} คน`;

  // 🔥 dropdown
  // จำค่าที่ผู้ใช้กำลังเลือกอยู่ก่อนสร้าง option ใหม่
  // และให้ pendingNextContestantId มีสิทธิ์สูงสุดหลังการบันทึก
  const select = document.getElementById("contestant");
  const previousSelectedId = select ? select.value : "";
  const targetSelectedId = pendingNextContestantId || previousSelectedId;

  if(select){
    select.innerHTML="";

    list.forEach(item=>{
      let o=document.createElement("option");
      o.value=item.id;
      o.text=item.name;

      if(item.locked){
        o.text += " ✔";
        o.style.color="green";
      }

      select.appendChild(o);
    });

    // ถ้ามีผู้ประกวดคนถัดไป ให้เลือกคนนั้น
    // ถ้าไม่มี/หาไม่พบ ให้รักษาคนเดิม ถ้ายังมีอยู่
    const targetExists = list.some(item => item.id === targetSelectedId);

    if(targetExists){
      select.value = targetSelectedId;
    }else if(select.options.length > 0){
      select.selectedIndex = 0;
    }
  }

  // ใช้เป้าหมายนี้เพียงครั้งเดียว แล้วปล่อยให้การเลือกครั้งต่อไป
  // ทำงานตามปกติ ไม่เด้งกลับไปคนที่ 1
  pendingNextContestantId = null;

  // ตารางคะแนนในหน้า index ถูกนำออกแล้ว
  // ยังคง cache สำหรับรายงานและประกาศผล
  cache=[...list];
  cache.sort((a,b)=>(b.totalScore||0)-(a.totalScore||0));
});

// ✅ REPORT (แก้แล้ว)
window.printDetail = function(){

  if(cache.length===0){
    alert("ยังไม่มีข้อมูล");
    return;
  }

  let html = `
  <html>
  <head>
  <meta charset="UTF-8">
  <style>
    @page{
      size:A4 portrait;
      margin:8mm;
    }
    *{box-sizing:border-box;}
    html,body{
      width:100%;
      margin:0;
      padding:0;
      font-family:sans-serif;
    }
    .page{
      page-break-after:always;
      width:100%;
    }
    .box{
      width:100%;
      display:block;
      border:1px solid #000;
      margin:0 0 4px 0;
      padding:3px 5px;
      font-size:11px;
      page-break-inside:avoid;
    }
    .box table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:10px;
      margin:0;
    }
    .box td,.box th{
      border:1px solid #000;
      padding:2px 3px;
      text-align:center;
    }
    .box td:first-child,
    .box th:first-child{
      width:32%;
      text-align:left;
    }
    .box td:not(:first-child),
    .box th:not(:first-child){
      width:17%;
    }
  </style>
  </head>
  <body>
  `;

  cache.forEach((c,i)=>{

    if(i % 10 === 0){
      html += `<div class="page">`;
    }

    html+=`
    <div class="box">
    <b>No.${i+1} ${c.name}</b>

    <table>
    <tr>
      <th>รายการ</th>
      <th>เต็ม</th>
      <th>กก1</th>
      <th>กก2</th>
      <th>กก3</th>
    </tr>`;

    items.forEach((it,idx)=>{
      html+=`
      <tr>
        <td>${it.name}</td>
        <td>${it.max}</td>
        <td>${c.score1?.[idx]||0}</td>
        <td>${c.score2?.[idx]||0}</td>
        <td>${c.score3?.[idx]||0}</td>
      </tr>`;
    });

    html+=`
    <tr>
      <td colspan="2"><b>รวม</b></td>
      <td><b>${c.j1||0}</b></td>
      <td><b>${c.j2||0}</b></td>
      <td><b>${c.j3||0}</b></td>
    </tr>

    <tr>
      <td colspan="5"><b>รวมทั้งหมด ${c.totalScore||0}</b></td>
    </tr>

    </table>
    </div>
    `;

    if((i+1)%10===0){
      html += `</div>`;
    }
  });

  if(cache.length % 10 !== 0){
    html += `</div>`;
  }

  html+="</body></html>";

  let w=window.open("");
  w.document.write(html);
  w.document.close();

  setTimeout(()=>w.print(),500);
};
