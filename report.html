<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานผลการประกวดร้องเพลง</title>
<style>
  @page { size: A4 portrait; margin: 8mm; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: Arial, "TH Sarabun New", Tahoma, sans-serif;
    font-size: 13px;
  }

  .toolbar {
    padding: 8px;
    margin-bottom: 5px;
  }

  button {
    border: 0;
    border-radius: 5px;
    padding: 7px 12px;
    margin-right: 4px;
    background: #45ad54;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    margin: 3px 0 8px;
  }

  #status {
    margin: 0 0 6px;
    font-size: 13px;
  }

  #report {
    width: 100%;
  }

  .contestant-page {
    break-after: page;
    page-break-after: always;
  }

  .contestant-page:last-child {
    break-after: auto;
    page-break-after: auto;
  }

  .contestant-box {
    border: 1px solid #222;
    margin-bottom: 5px;
    padding: 3px;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .contestant-title {
    border-bottom: 1px solid #222;
    padding: 2px 5px 3px;
    font-weight: 700;
    font-size: 14px;
  }

  .rank {
    font-weight: 700;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    border: 1px solid #222;
    padding: 2px 4px;
    height: 17px;
    line-height: 1.05;
    text-align: center;
    font-size: 13px;
  }

  th {
    font-weight: 700;
    background: #f1f1f1;
  }

  th:first-child, td:first-child {
    text-align: left;
    width: 36%;
  }

  .judge-total td {
    font-weight: 700;
  }

  .grand-total td {
    font-weight: 700;
    border-top: 2px solid #111;
  }

  .grand-total td:last-child {
    font-size: 14px;
  }

  .empty {
    text-align: center;
    padding: 20px;
    border: 1px solid #222;
  }

  .error {
    color: #b00000;
  }

  @media screen {
    body {
      background: #eee;
    }
    .toolbar, h1, #status, #report {
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
    .contestant-page {
      background: #fff;
      padding: 8px;
      margin: 0 auto 15px;
      max-width: 1100px;
      box-shadow: 0 1px 6px rgba(0,0,0,.12);
    }
  }

  @media print {
    .toolbar, #status {
      display: none !important;
    }
    h1 {
      margin-top: 0;
    }
    .contestant-page {
      padding: 0;
    }
  }
</style>
</head>

<body>
<div class="toolbar">
  <button type="button" onclick="goAdmin()">⬅️ กลับ Admin</button>
  <button type="button" onclick="logout()">🚪 Logout</button>
  <button type="button" onclick="window.print()">🖨️ พิมพ์รายงาน</button>
</div>

<h1>📄 รายงานผลการประกวดร้องเพลง</h1>
<div id="status">กำลังตรวจสอบสิทธิ์และโหลดข้อมูล...</div>
<div id="report"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const SESSION_KEY = "singingContestAdminSession";

const criteria = [
  { key: 0, name: "น้ำเสียง", max: 30 },
  { key: 1, name: "เทคนิค", max: 10 },
  { key: 2, name: "จังหวะ", max: 20 },
  { key: 3, name: "อักขระ", max: 10 },
  { key: 4, name: "บุคลิก", max: 10 },
  { key: 5, name: "ความยาก", max: 10 },
  { key: 6, name: "แต่งกาย", max: 10 }
];

function esc(v) {
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function requireSession() {
  const raw = localStorage.getItem(SESSION_KEY);

  if (!raw) {
    location.replace("./admin.html");
    return null;
  }

  try {
    const saved = JSON.parse(raw);
    if (!saved?.id || !saved?.username) throw new Error("Invalid session");

    const snap = await getDocs(collection(db, "admins"));
    let current = null;

    snap.forEach(d => {
      const a = d.data();
      if (
        d.id === saved.id &&
        String(a.username || "").trim().toLowerCase() ===
          String(saved.username || "").trim().toLowerCase() &&
        a.active !== false
      ) {
        current = {
          id: d.id,
          username: String(a.username || "").trim(),
          role: String(a.role || "admin").trim().toLowerCase()
        };
      }
    });

    if (!current) {
      localStorage.removeItem(SESSION_KEY);
      location.replace("./admin.html");
      return null;
    }

    return current;
  } catch (err) {
    console.error(err);
    localStorage.removeItem(SESSION_KEY);
    location.replace("./admin.html");
    return null;
  }
}

window.goAdmin = () => location.replace("./admin.html");

window.logout = () => {
  localStorage.removeItem(SESSION_KEY);
  location.replace("./admin.html");
};

function arrScore(arr, index) {
  if (!Array.isArray(arr)) return "";
  const n = Number(arr[index]);
  return Number.isFinite(n) ? n : "";
}

function sumArray(arr) {
  if (!Array.isArray(arr)) return null;
  return arr.reduce((sum, v) => {
    const n = Number(v);
    return sum + (Number.isFinite(n) ? n : 0);
  }, 0);
}

async function loadContestants() {
  const snap = await getDocs(collection(db, "contestants"));
  const rows = [];

  snap.forEach(d => {
    const x = d.data();

    rows.push({
      id: d.id,
      order: Number(x.order ?? 999999),
      name: String(x.name ?? ""),
      score1: Array.isArray(x.score1) ? x.score1 : [],
      score2: Array.isArray(x.score2) ? x.score2 : [],
      score3: Array.isArray(x.score3) ? x.score3 : [],
      j1: Number(x.j1 ?? 0),
      j2: Number(x.j2 ?? 0),
      j3: Number(x.j3 ?? 0),
      totalScore: Number(x.totalScore ?? 0)
    });
  });

  rows.sort((a,b) =>
    b.totalScore - a.totalScore ||
    a.order - b.order
  );

  return rows;
}

function judgeTotal(c, judgeIndex) {
  const arr = c["score" + judgeIndex];

  // ใช้รายละเอียด 7 รายการเป็นหลัก
  const calculated = sumArray(arr);

  if (calculated !== null) return calculated;

  // รองรับข้อมูลเก่าที่เก็บเฉพาะยอดกรรมการ
  return Number(c["j" + judgeIndex] || 0);
}

function buildContestant(c, rank) {
  const t1 = judgeTotal(c, 1);
  const t2 = judgeTotal(c, 2);
  const t3 = judgeTotal(c, 3);

  return `
    <div class="contestant-box">
      <div class="contestant-title">
        <span class="rank">อันดับที่ ${rank}</span>
        &nbsp;&nbsp;หมายเลข ${esc(c.order)}
        &nbsp;&nbsp;${esc(c.name)}
      </div>

      <table>
        <thead>
          <tr>
            <th>รายการ</th>
            <th>เต็ม</th>
            <th>กรรมการ 1</th>
            <th>กรรมการ 2</th>
            <th>กรรมการ 3</th>
          </tr>
        </thead>

        <tbody>
          ${criteria.map(item => `
            <tr>
              <td>${esc(item.name)}</td>
              <td>${item.max}</td>
              <td>${esc(arrScore(c.score1, item.key))}</td>
              <td>${esc(arrScore(c.score2, item.key))}</td>
              <td>${esc(arrScore(c.score3, item.key))}</td>
            </tr>
          `).join("")}

          <tr class="judge-total">
            <td>รวม</td>
            <td></td>
            <td>${t1}</td>
            <td>${t2}</td>
            <td>${t3}</td>
          </tr>

          <tr class="grand-total">
            <td colspan="4">รวมทั้งหมด</td>
            <td>${Number(c.totalScore || (t1+t2+t3))}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

async function loadReport() {
  const user = await requireSession();
  if (!user) return;

  try {
    const rows = await loadContestants();

    if (!rows.length) {
      document.getElementById("status").textContent = "ไม่พบข้อมูลผู้ประกวด";
      document.getElementById("report").innerHTML =
        '<div class="empty">ไม่พบข้อมูลผู้ประกวด</div>';
      return;
    }

    const pages = [];
    const perPage = 5;

    for (let i = 0; i < rows.length; i += perPage) {
      const pageRows = rows.slice(i, i + perPage);

      pages.push(`
        <section class="contestant-page">
          ${pageRows.map((c, localIndex) =>
            buildContestant(c, i + localIndex + 1)
          ).join("")}
        </section>
      `);
    }

    document.getElementById("report").innerHTML = pages.join("");
    document.getElementById("status").textContent =
      `พบผู้ประกวด ${rows.length} คน • แสดงรายละเอียดคะแนนกรรมการ 1–3 • ขนาดตัวอักษร 13px`;
  } catch (err) {
    console.error(err);
    document.getElementById("status").innerHTML =
      '<span class="error">❌ โหลดข้อมูลไม่ได้: ' + esc(err.message) + '</span>';
  }
}

loadReport();
</script>
</body>
</html>
