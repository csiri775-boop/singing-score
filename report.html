<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายงาน</title>
<style>body{font-family:Arial;margin:20px}.bar{margin-bottom:15px}button{padding:9px 14px;margin:3px;border:0;border-radius:5px;background:#45ad54;color:#fff}table{width:100%;border-collapse:collapse}th,td{border:1px solid #222;padding:7px;text-align:center}th{background:#eee}@media print{.bar{display:none}}</style></head><body>
<div class="bar"><button onclick="goAdmin()">⬅️ กลับ Admin</button><button onclick="logout()">🚪 Logout</button><button onclick="print()">🖨️ พิมพ์รายงาน</button></div><h1 style="text-align:center">📄 รายงานผลการประกวดร้องเพลง</h1><table><thead><tr><th>อันดับ</th><th>หมายเลข</th><th>ชื่อผู้ประกวด</th><th>คะแนนรวม</th></tr></thead><tbody id="tb"></tbody></table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const SESSION_KEY="singingContestAdminSession";
async function requireSession(){
 const raw=localStorage.getItem(SESSION_KEY);
 if(!raw){ alert("🔐 กรุณาเข้าสู่ระบบ Admin ก่อน"); location.href="./admin.html"; return false; }
 try{ const s=JSON.parse(raw); if(!s?.id) throw 0; return true; }
 catch(e){ localStorage.removeItem(SESSION_KEY); location.href="./admin.html"; return false; }
}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
window.goAdmin=()=>location.href="./admin.html";
window.logout=()=>{localStorage.removeItem(SESSION_KEY);location.href="./admin.html";};
</script>

<script>
async function load(){if(!await requireSession())return;let a=[];(await getDocs(collection(db,"contestants"))).forEach(d=>{let x=d.data();a.push({number:x.order??"",name:x.name??"",score:Number(x.totalScore||0)})});a.sort((x,y)=>y.score-x.score||Number(x.number)-Number(y.number));document.getElementById("tb").innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.number)}</td><td>${esc(x.name)}</td><td>${x.score}</td></tr>`).join("");}load();
</script></body></html>
