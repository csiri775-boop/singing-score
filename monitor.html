<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor - ตารางคะแนน</title>

<style>
body{
  background:black;
  color:white;
  font-family:sans-serif;
  text-align:center;
  margin:0;
  padding:20px;
}

h1{
  font-size:50px;
  margin:20px;
}

table{
  width:80%;
  margin:auto;
  border-collapse:collapse;
  font-size:28px;
}

td,th{
  border:1px solid white;
  padding:10px;
}

th{
  background:#222;
}

/* อันดับ 1 */
.gold{
  background:gold;
  color:black;
  font-weight:bold;
}

/* คะแนนเสมอกัน */
.tie{
  color:red !important;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🏆 ตารางคะแนน</h1>

<table>
<thead>
<tr>
<th>อันดับ</th>
<th>ชื่อ</th>
<th>คะแนน</th>
</tr>
</thead>

<tbody id="tb"></tbody>

</table>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ==============================
   REAL-TIME DATA
============================== */

onSnapshot(
  collection(db,"contestants"),

  snap => {

    let list = [];

    snap.forEach(doc => {

      const d = doc.data();

      list.push({

        name: d.name || "",

        score: Number(d.totalScore || 0),

        order: Number(d.order || 9999)

      });

    });


    /* ==============================
       เรียงคะแนนมาก → น้อย
    ============================== */

    list.sort((a,b) => {

      if(b.score !== a.score){

        return b.score - a.score;

      }

      return a.order - b.order;

    });


    /* ==============================
       ตรวจคะแนนเสมอกัน
    ============================== */

    const scoreCount = {};

    list.forEach(c => {

      if(!scoreCount[c.score]){

        scoreCount[c.score] = 0;

      }

      scoreCount[c.score]++;

    });


    /* ==============================
       สร้างตาราง
    ============================== */

    let html = "";


    list.forEach((c,i) => {

      const isTie = scoreCount[c.score] > 1;


      /*
       * ถ้าคะแนนเสมอกัน
       * อันดับ + ชื่อ + คะแนน = สีแดง
       */

      const tieClass = isTie ? "tie" : "";


      /*
       * อันดับ 1 สีทอง
       * แต่ถ้าคะแนนเสมอ ให้ใช้สีแดงแทน
       */

      const rowClass =
        (!isTie && i === 0)
          ? "gold"
          : "";


      html += `

      <tr class="${rowClass}">

        <td class="${tieClass}">
          ${i + 1}
        </td>

        <td class="${tieClass}">
          ${escapeHtml(c.name)}
        </td>

        <td class="${tieClass}">
          ${c.score}
        </td>

      </tr>

      `;

    });


    document.getElementById("tb").innerHTML = html;

  },

  error => {

    console.error(
      "Firebase Error:",
      error
    );

    document.getElementById("tb").innerHTML = `

      <tr>

        <td colspan="3"
            style="color:red;font-size:24px;">

          ❌ ไม่สามารถโหลดข้อมูลได้

        </td>

      </tr>

    `;

  }

);


/* ==============================
   ป้องกัน HTML แปลกปลอมจากชื่อ
============================== */

function escapeHtml(value){

  return String(value ?? "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
