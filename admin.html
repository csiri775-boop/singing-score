<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Management - Singing Contest Scoring System</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#f5f5f5;
  color:#222;
  font-family:Arial,sans-serif;
}
.header{
  text-align:center;
  margin-bottom:18px;
}
.header h1{
  margin:0;
  font-size:30px;
}
.header p{
  margin:5px 0 0;
  font-weight:bold;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:white;
  border-radius:8px;
  padding:12px 15px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.user{
  font-weight:bold;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
button{
  border:0;
  border-radius:5px;
  padding:9px 14px;
  background:#45ad54;
  color:white;
  cursor:pointer;
  font-size:14px;
}
button:hover{opacity:.9}
.btn-red{background:#d9363e}
.btn-gray{background:#777}
.card{
  margin-top:15px;
  background:white;
  border-radius:8px;
  padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}
.form-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
input{
  height:38px;
  padding:7px 10px;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:15px;
}
#newUsername{width:190px}
#newPassword{width:190px}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}
th{
  background:#eee;
  font-size:16px;
}
td:first-child{text-align:left}
.dev{
  color:#6a1b9a;
  font-weight:bold;
}
.active{
  color:green;
  font-weight:bold;
}
.disabled{
  color:#b00000;
  font-weight:bold;
}
.message{
  margin-top:10px;
  min-height:20px;
}
.login-box{
  width:min(420px,95%);
  margin:90px auto;
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
  text-align:center;
}
.login-box input{
  width:100%;
  margin:6px 0;
}
.login-box button{
  margin-top:10px;
}
.copyright{
  margin-top:18px;
  font-size:13px;
  color:#666;
}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="loginBox" class="login-box">
  <h2>🔐 Admin Login</h2>
  <input id="loginUser" placeholder="Username" autocomplete="username">
  <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Login</button>
  <div class="copyright">
    All Rights Reserved by <b>MR.SIRICHAI BUDDASUY</b>, System Developer
  </div>
</div>

<div id="page" class="hidden">

  <div class="header">
    <h1>⚙️ จัดการแอดมิน</h1>
    <p>Admin Management</p>
  </div>

  <div class="topbar">
    <div class="user" id="userLabel">👤 แอดมิน</div>
    <div class="actions">
      <button onclick="goIndex()">⬅️ กลับหน้าหลัก</button>
      <button class="btn-red" onclick="logout()">🚪 ล็อกเอาท์</button>
    </div>
  </div>

  <div class="card">
    <h2>➕ เพิ่มแอดมิน</h2>

    <div class="form-row">
      <input id="newUsername" placeholder="ชื่อแอดมิน">
      <input id="newPassword" type="password" placeholder="รหัสผ่าน">
      <button onclick="addAdmin()">➕ เพิ่มแอดมิน</button>
      <button class="btn-gray" onclick="loadAdmins()">🔄 รีเฟรช</button>
    </div>

    <div id="message" class="message"></div>

    <table>
      <thead>
        <tr>
          <th>ชื่อแอดมิน</th>
          <th>สถานะ</th>
          <th>การจัดการ</th>
        </tr>
      </thead>
      <tbody id="adminList">
        <tr><td colspan="3">กำลังโหลด...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  addDoc,
  setDoc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const SESSION_KEY = "singingContestAdminSession";
const DEVELOPER_USERNAME = "sirichai";
const DEVELOPER_PASSWORD = "Sb270887";
const DEVELOPER_ROLE = "developer";

let currentAdmin = null;

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escJs(v){
  return String(v ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n","\\n")
    .replaceAll("\r","\\r");
}

function showMessage(msg, ok=true){
  const el=document.getElementById("message");
  el.textContent=msg;
  el.style.color=ok ? "green" : "#b00000";
}

function showPage(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("page").classList.remove("hidden");
  document.getElementById("userLabel").textContent =
    `👤 แอดมิน: ${currentAdmin.username}`;
  loadAdmins();
}

function showLogin(){
  currentAdmin=null;
  document.getElementById("page").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

window.login=async function(){
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPass").value;

  if(!u || !p){
    alert("กรุณากรอก Username และ Password");
    return;
  }

  try{
    const snap=await getDocs(collection(db,"admins"));
    let found=null;

    snap.forEach(d=>{
      const a=d.data();
      if(
        String(a.username||"").trim().toLowerCase()===u.toLowerCase() &&
        String(a.password||"")===p &&
        a.active!==false
      ){
        found={
          id:d.id,
          username:a.username,
          role:a.role||"admin",
          protected:a.protected===true
        };
      }
    });

    // Bootstrap developer account if the collection is empty.
    if(!found && snap.empty &&
       u.toLowerCase()===DEVELOPER_USERNAME &&
       p===DEVELOPER_PASSWORD){

      const ref=doc(collection(db,"admins"));

      await setDoc(ref,{
        username:DEVELOPER_USERNAME,
        password:DEVELOPER_PASSWORD,
        active:true,
        role:DEVELOPER_ROLE,
        protected:true,
        createdAt:new Date().toISOString()
      });

      found={
        id:ref.id,
        username:DEVELOPER_USERNAME,
        role:DEVELOPER_ROLE,
        protected:true
      };
    }

    if(!found){
      alert("❌ Username หรือ Password ไม่ถูกต้อง หรือบัญชีถูกปิดใช้งาน");
      return;
    }

    currentAdmin=found;

    localStorage.setItem(SESSION_KEY,JSON.stringify({
      id:found.id,
      username:found.username,
      role:found.role,
      protected:found.protected,
      loginAt:Date.now()
    }));

    showPage();

  }catch(err){
    console.error(err);
    alert("❌ เข้าสู่ระบบไม่สำเร็จ\n"+err.message);
  }
};

async function restoreSession(){
  const raw=localStorage.getItem(SESSION_KEY);

  if(!raw){
    showLogin();
    return;
  }

  try{
    const saved=JSON.parse(raw);
    if(!saved?.id || !saved?.username) throw new Error("Invalid session");

    const target=await getDoc(doc(db,"admins",saved.id));

    if(
      target.exists() &&
      String(target.data().username||"")===String(saved.username) &&
      target.data().active!==false
    ){
      const a=target.data();

      currentAdmin={
        id:target.id,
        username:a.username,
        role:a.role||"admin",
        protected:a.protected===true ||
                  String(a.role||"").toLowerCase()===DEVELOPER_ROLE
      };

      showPage();
    }else{
      localStorage.removeItem(SESSION_KEY);
      showLogin();
    }

  }catch(err){
    console.error(err);
    localStorage.removeItem(SESSION_KEY);
    showLogin();
  }
}

window.logout=function(){
  if(!confirm("ยืนยันล็อกเอาท์ออกจากระบบ?")) return;

  localStorage.removeItem(SESSION_KEY);
  document.getElementById("loginUser").value="";
  document.getElementById("loginPass").value="";
  showLogin();
};

window.goIndex=function(){
  window.location.href="index.html";
};

window.loadAdmins=async function(){
  const body=document.getElementById("adminList");
  body.innerHTML='<tr><td colspan="3">กำลังโหลด...</td></tr>';

  try{
    const snap=await getDocs(collection(db,"admins"));

    if(snap.empty){
      body.innerHTML='<tr><td colspan="3">ยังไม่มีบัญชีแอดมิน</td></tr>';
      return;
    }

    const admins=[];

    snap.forEach(d=>{
      const a=d.data();
      admins.push({
        id:d.id,
        username:String(a.username||""),
        active:a.active!==false,
        role:String(a.role||"admin"),
        protected:a.protected===true
      });
    });

    admins.sort((a,b)=>a.username.localeCompare(b.username));

    body.innerHTML=admins.map(a=>{
      const developer=
        a.protected ||
        a.role.toLowerCase()===DEVELOPER_ROLE ||
        a.username.toLowerCase()===DEVELOPER_USERNAME;

      return `
      <tr>
        <td class="${developer ? "dev" : ""}">
          ${esc(a.username)}
          ${developer ? " 🛡️ ผู้พัฒนาระบบ" : ""}
        </td>

        <td class="${developer ? "dev" : (a.active ? "active":"disabled")}">
          ${developer ? "ใช้งานถาวร" : (a.active ? "ใช้งาน":"ปิดใช้งาน")}
        </td>

        <td>
          ${
            developer
            ? '<span class="dev">🔒 ห้ามลบ / ห้ามแก้ไข</span>'
            : `
              <button onclick="toggleAdmin('${a.id}',${a.active})">
                ${a.active ? "🔒 ปิดใช้งาน":"🔓 เปิดใช้งาน"}
              </button>
              <button class="btn-red"
                onclick="deleteAdmin('${a.id}','${escJs(a.username)}')">
                🗑️ ลบ
              </button>
            `
          }
        </td>
      </tr>`;
    }).join("");

  }catch(err){
    console.error(err);
    body.innerHTML=
      '<tr><td colspan="3" style="color:red">โหลดข้อมูลไม่สำเร็จ</td></tr>';
  }
};

window.addAdmin=async function(){
  const username=document.getElementById("newUsername").value.trim();
  const password=document.getElementById("newPassword").value;

  if(!username || !password){
    return showMessage("กรุณากรอกชื่อแอดมินและรหัสผ่าน",false);
  }

  if(password.length<4){
    return showMessage("รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร",false);
  }

  if(username.toLowerCase()===DEVELOPER_USERNAME){
    return showMessage("❌ ชื่อ sirichai สงวนไว้สำหรับผู้พัฒนาระบบ",false);
  }

  try{
    const snap=await getDocs(collection(db,"admins"));

    let duplicate=false;
    snap.forEach(d=>{
      if(String(d.data().username||"").toLowerCase()===username.toLowerCase())
        duplicate=true;
    });

    if(duplicate){
      return showMessage("❌ มีชื่อแอดมินนี้อยู่แล้ว",false);
    }

    await addDoc(collection(db,"admins"),{
      username,
      password,
      active:true,
      role:"admin",
      protected:false,
      createdAt:new Date().toISOString()
    });

    document.getElementById("newUsername").value="";
    document.getElementById("newPassword").value="";

    await loadAdmins();
    showMessage("✅ เพิ่มแอดมินเรียบร้อยแล้ว",true);

  }catch(err){
    console.error(err);
    showMessage("❌ เพิ่มแอดมินไม่สำเร็จ: "+err.message,false);
  }
};

window.toggleAdmin=async function(id,active){
  try{
    const target=await getDoc(doc(db,"admins",id));

    if(!target.exists()){
      return showMessage("ไม่พบบัญชีแอดมิน",false);
    }

    const a=target.data();

    if(
      a.protected===true ||
      String(a.role||"").toLowerCase()===DEVELOPER_ROLE ||
      String(a.username||"").toLowerCase()===DEVELOPER_USERNAME
    ){
      return alert("🔒 บัญชีผู้พัฒนาระบบห้ามแก้ไขหรือปิดใช้งาน");
    }

    if(id===currentAdmin.id){
      return alert("ไม่สามารถปิดใช้งานบัญชีที่กำลังล็อกอินอยู่ได้");
    }

    await updateDoc(doc(db,"admins",id),{active:!active});
    await loadAdmins();

  }catch(err){
    console.error(err);
    showMessage("❌ เปลี่ยนสถานะไม่สำเร็จ: "+err.message,false);
  }
};

window.deleteAdmin=async function(id,username){
  if(id===currentAdmin.id){
    return alert("ไม่สามารถลบบัญชีที่กำลังล็อกอินอยู่ได้");
  }

  try{
    const target=await getDoc(doc(db,"admins",id));

    if(!target.exists()){
      return showMessage("ไม่พบบัญชีแอดมิน",false);
    }

    const a=target.data();

    if(
      a.protected===true ||
      String(a.role||"").toLowerCase()===DEVELOPER_ROLE ||
      String(a.username||"").toLowerCase()===DEVELOPER_USERNAME
    ){
      return alert("🔒 บัญชีผู้พัฒนาระบบห้ามลบหรือแก้ไข");
    }

    if(!confirm(`ยืนยันลบแอดมิน "${username}" ?`)) return;

    await deleteDoc(doc(db,"admins",id));
    await loadAdmins();
    showMessage("✅ ลบแอดมินเรียบร้อยแล้ว",true);

  }catch(err){
    console.error(err);
    showMessage("❌ ลบแอดมินไม่สำเร็จ: "+err.message,false);
  }
};

restoreSession();

</script>
</body>
</html>
