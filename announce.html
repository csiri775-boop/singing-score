<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ประกาศผล - Singing Contest</title>
<style>
*{box-sizing:border-box}
body{
  font-family:Arial,"TH Sarabun New",sans-serif;
  background:#111;color:#fff;margin:0;padding:20px;text-align:center
}
.bar{margin-bottom:15px}
button{
  padding:9px 15px;margin:3px;border:0;border-radius:5px;
  background:#45ad54;color:#fff;cursor:pointer
}
h1{font-size:34px;margin:12px 0 20px}
table{width:90%;margin:0 auto;border-collapse:collapse;font-size:24px}
th,td{border:1px solid #fff;padding:10px}
th{background:#333}
.gold{background:gold;color:#000;font-weight:bold}
.tie{
  color:red !important;font-weight:bold;text-decoration:underline;
  text-decoration-thickness:2px;text-underline-offset:3px
}
.error{color:#ff5555}
@media (min-width:1600px){
  table{font-size:30px}
  h1{font-size:50px}
}

/* ===== PRINT: A4 ===== */
@media print{
  @page{
    size:A4 portrait;
    margin:10mm;
  }

  html,body{
    width:100%;
    min-height:0;
    margin:0 !important;
    padding:0 !important;
    background:#fff !important;
    color:#000 !important;
  }

  .bar{
    display:none !important;
  }

  h1{
    color:#000 !important;
    font-size:20pt !important;
    margin:0 0 6mm !important;
    line-height:1.15 !important;
  }

  #status{
    color:#000 !important;
    font-size:10pt !important;
    margin-bottom:4mm !important;
  }

  table{
    width:100% !important;
    margin:0 !important;
    border-collapse:collapse !important;
    table-layout:fixed !important;
    font-size:12pt !important;
    line-height:1.15 !important;
  }

  th,td{
    border:1px solid #000 !important;
    color:#000 !important;
    padding:3mm 2mm !important;
    font-size:12pt !important;
    line-height:1.15 !important;
    word-break:break-word;
  }

  th{
    background:#eee !important;
    color:#000 !important;
  }

  /* รายการปกติ = ดำ */
  tr:not(.print-tie) td{
    color:#000 !important;
  }

  /* คะแนนเสมอ = แดง เฉพาะอันดับ/ชื่อ/คะแนน */
  .print-tie,
  .print-tie td{
    color:red !important;
    background:transparent !important;
    text-decoration:underline !important;
    text-decoration-thickness:1.5px !important;
    text-underline-offset:2px !important;
    font-weight:bold !important;
  }

  /* อันดับ 1 ปกติยังคงพื้นทองเมื่อพิมพ์ */
  tr.gold:not(.print-tie) td{
    background:gold !important;
    color:#000 !important;
    font-weight:bold !important;
  }

  /* ป้องกันแถวถูกตัดครึ่ง */
  tr{
    break-inside:avoid !important;
    page-break-inside:avoid !important;
  }

  thead{
    display:table-header-group;
  }
}
</style>
</head>
<body>

<div class="bar">
  <button type="button" onclick="goAdmin()">⬅️ กลับ Admin</button>
  <button type="button" onclick="window.print()">🖨️ พิมพ์ประกาศผล</button>
  <button type="button" onclick="logout()">🚪 Logout</button>
</div>

<h1>📢 ประกาศผลการประกวดร้องเพลง</h1>
<div id="status">กำลังตรวจสอบสิทธิ์และโหลดข้อมูล...</div>

<table>
<thead>
<tr>
  <th>อันดับ</th>
  <th>ชื่อผู้ประกวด</th>
  <th>คะแนน</th>
</tr>
</thead>
<tbody id="tb">
<tr><td colspan="3">กำลังโหลด...</td></tr>
</tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const SESSION_KEY = "singingContestAdminSession";

function esc(v) {
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function requireSession() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) {
    location.replace("./admin.html");
    return null;
  }

  try {
    const saved = JSON.parse(raw);
    if (!saved?.id || !saved?.username) throw new Error("Invalid session");

    const snap = await getDocs(collection(db, "admins"));
    let current = null;

    snap.forEach(d => {
      const a = d.data();
      if (
        d.id === saved.id &&
        String(a.username || "").trim().toLowerCase() ===
          String(saved.username || "").trim().toLowerCase() &&
        a.active !== false
      ) {
        current = {
          id: d.id,
          username: String(a.username || "").trim(),
          role: String(a.role || "admin").trim().toLowerCase()
        };
      }
    });

    if (!current) {
      localStorage.removeItem(SESSION_KEY);
      location.replace("./admin.html");
      return null;
    }

    return current;
  } catch (err) {
    console.error("Session error:", err);
    localStorage.removeItem(SESSION_KEY);
    location.replace("./admin.html");
    return null;
  }
}

window.goAdmin = () => location.replace("./admin.html");

window.logout = () => {
  localStorage.removeItem(SESSION_KEY);
  location.replace("./admin.html");
};

async function loadContestants() {
  const user = await requireSession();
  if (!user) return [];

  const snap = await getDocs(collection(db, "contestants"));
  const rows = [];

  snap.forEach(d => {
    const x = d.data();
    rows.push({
      id: d.id,
      number: x.order ?? "",
      name: String(x.name ?? ""),
      score: Number(x.totalScore ?? 0)
    });
  });

  rows.sort((a,b) =>
    b.score - a.score ||
    (Number(a.number) || 999999) - (Number(b.number) || 999999)
  );

  return rows;
}

async function load() {
  try {
    const rows = await loadContestants();

    if (!rows.length) {
      document.getElementById("tb").innerHTML =
        '<tr><td colspan="3">ไม่พบข้อมูลผู้ประกวด</td></tr>';
      document.getElementById("status").textContent = "ไม่พบข้อมูล";
      return;
    }

    const scoreCount = {};
    rows.forEach(x => {
      scoreCount[x.score] = (scoreCount[x.score] || 0) + 1;
    });

    document.getElementById("tb").innerHTML = rows.map((x,i) => {
      const tie = scoreCount[x.score] > 1;
      const rowClass = [
        (!tie && i === 0) ? "gold" : "",
        tie ? "print-tie" : ""
      ].filter(Boolean).join(" ");

      const cls = tie ? "tie" : "";

      return `
        <tr class="${rowClass}">
          <td class="${cls}">อันดับ ${i+1}</td>
          <td class="${cls}">${esc(x.name)}</td>
          <td class="${cls}">${x.score}</td>
        </tr>
      `;
    }).join("");

    document.getElementById("status").textContent =
      `พบผู้ประกวด ${rows.length} คน`;
  } catch (err) {
    console.error(err);
    document.getElementById("status").innerHTML =
      '<span class="error">❌ โหลดข้อมูลไม่ได้ กรุณาตรวจสอบ Firebase Configuration และ Firestore Rules</span>';
  }
}

load();
</script>
</body>
</html>
