<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ประกาศผล - Singing Contest</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,"TH Sarabun New",sans-serif;background:#111;color:#fff;margin:0;padding:20px;text-align:center}
.bar{margin-bottom:15px}
button{padding:9px 15px;margin:3px;border:0;border-radius:5px;background:#45ad54;color:#fff;cursor:pointer}
h1{font-size:34px;margin:12px 0 20px}
table{width:90%;margin:0 auto;border-collapse:collapse;font-size:24px}
th,td{border:1px solid #fff;padding:10px}
th{background:#333}
.gold{background:gold;color:#000;font-weight:bold}
.tie{color:red !important;font-weight:bold;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.error{color:#ff5555}
@media (min-width:1600px){table{font-size:30px} h1{font-size:50px}}

@media print{
  body{background:#fff !important;color:#000 !important;}
  .bar{display:none !important;}
  h1,#status{color:#000 !important;}
  table,thead,tbody,tr,th,td{color:#000 !important;}
  .tie,
  .tie td,
  td.tie,
  .tie th{
    color:red !important;
  }
}

</style>
</head>
<body>
<div class="bar">
  <button type="button" onclick="goAdmin()">⬅️ กลับ Admin</button>
  <button type="button" onclick="logout()">🚪 Logout</button>
</div>
<h1>📢 ประกาศผลการประกวดร้องเพลง</h1>
<div id="status">กำลังตรวจสอบสิทธิ์และโหลดข้อมูล...</div>
<table>
<thead><tr><th>อันดับ</th><th>ชื่อผู้ประกวด</th><th>คะแนน</th></tr></thead>
<tbody id="tb"><tr><td colspan="3">กำลังโหลด...</td></tr></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const SESSION_KEY = "singingContestAdminSession";

function esc(v) {
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function requireSession() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) {
    location.replace("./admin.html");
    return null;
  }

  try {
    const saved = JSON.parse(raw);
    if (!saved?.id || !saved?.username) throw new Error("Invalid session");

    // ตรวจสอบบัญชีจริงใน Firestore ทุกครั้ง
    const snap = await getDocs(collection(db, "admins"));
    let current = null;

    snap.forEach(d => {
      const a = d.data();
      if (
        d.id === saved.id &&
        String(a.username || "").trim().toLowerCase() ===
          String(saved.username || "").trim().toLowerCase() &&
        a.active !== false
      ) {
        current = {
          id: d.id,
          username: String(a.username || "").trim(),
          role: String(a.role || "admin").trim().toLowerCase()
        };
      }
    });

    if (!current) {
      localStorage.removeItem(SESSION_KEY);
      location.replace("./admin.html");
      return null;
    }

    return current;
  } catch (err) {
    console.error("Session error:", err);
    localStorage.removeItem(SESSION_KEY);
    location.replace("./admin.html");
    return null;
  }
}

window.goAdmin = () => location.replace("./admin.html");

window.logout = () => {
  localStorage.removeItem(SESSION_KEY);
  location.replace("./admin.html");
};

async function loadContestants() {
  const user = await requireSession();
  if (!user) return [];

  const snap = await getDocs(collection(db, "contestants"));
  const rows = [];

  snap.forEach(d => {
    const x = d.data();
    rows.push({
      id: d.id,
      number: x.order ?? "",
      name: String(x.name ?? ""),
      score: Number(x.totalScore ?? 0)
    });
  });

  rows.sort((a,b) =>
    b.score - a.score ||
    (Number(a.number) || 999999) - (Number(b.number) || 999999)
  );

  return rows;
}


async function load() {
  try {
    const rows = await loadContestants();

    if (!rows.length) {
      document.getElementById("tb").innerHTML =
        '<tr><td colspan="3">ไม่พบข้อมูลผู้ประกวด</td></tr>';
      document.getElementById("status").textContent = "ไม่พบข้อมูล";
      return;
    }

    const scoreCount = {};
    rows.forEach(x => {
      scoreCount[x.score] = (scoreCount[x.score] || 0) + 1;
    });

    document.getElementById("tb").innerHTML = rows.map((x,i) => {
      const tie = scoreCount[x.score] > 1;
      const rowClass = (!tie && i === 0) ? "gold" : "";
      const cls = tie ? "tie" : "";

      return `
        <tr class="${rowClass}">
          <td class="${cls}">อันดับ ${i+1}</td>
          <td class="${cls}">${esc(x.name)}</td>
          <td class="${cls}">${x.score}</td>
        </tr>
      `;
    }).join("");

    document.getElementById("status").textContent =
      `พบผู้ประกวด ${rows.length} คน`;
  } catch (err) {
    console.error(err);
    document.getElementById("status").innerHTML =
      '<span class="error">❌ โหลดข้อมูลไม่ได้ กรุณาตรวจสอบ Firebase Configuration และ Firestore Rules</span>';
  }
}

load();
</script>
</body>
</html>
