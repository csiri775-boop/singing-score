<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel - รายละเอียดผลการประกวดร้องเพลง</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f3f3;
  color:#111;
  font-family:Arial,"TH Sarabun New",Tahoma,sans-serif;
  font-size:14px;
}
.container{width:100%;padding:12px}
.toolbar{
  background:#fff;padding:10px;border-radius:8px;margin-bottom:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}
button{
  border:0;border-radius:5px;padding:8px 14px;margin-right:5px;
  background:#45ad54;color:#fff;cursor:pointer;font-size:14px;
}
button:hover{opacity:.9}
button:disabled{opacity:.55;cursor:not-allowed}
h1{text-align:center;margin:8px 0 10px;font-size:24px}
#status{margin:0 0 8px;padding:7px 9px;background:#fff;border-radius:5px}
.error{color:#b00000}
.contestant-box{
  background:#fff;border:1px solid #222;margin:0 0 10px;padding:4px;border-radius:2px;
}
.contestant-title{
  border-bottom:1px solid #222;padding:3px 5px;font-weight:700;font-size:15px;
}
.rank{font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{
  border:1px solid #222;padding:3px 5px;height:19px;line-height:1.1;
  text-align:center;font-size:14px;
}
th{background:#eee;font-weight:700}
th:first-child,td:first-child{text-align:left;width:28%}
.judge-total td,.grand-total td{font-weight:700}
.grand-total td{border-top:2px solid #111}
.grand-total td:last-child{font-size:15px}
@media screen and (min-width:1200px){.container{padding:15px 20px}}
</style>
</head>
<body>
<div class="container">

  <div class="toolbar">
    <button type="button" id="backBtn">⬅️ กลับ Admin</button>
    <button type="button" id="logoutBtn">🚪 Logout</button>
    <button type="button" id="downloadBtn" disabled>📥 ดาวน์โหลด Excel</button>
  </div>

  <h1>📊 รายละเอียดผลการประกวดร้องเพลง</h1>
  <div id="status">กำลังตรวจสอบสิทธิ์และโหลดข้อมูล...</div>
  <div id="report"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const SESSION_KEY = "singingContestAdminSession";

const criteria = [
  {key:0,name:"น้ำเสียง",max:30},
  {key:1,name:"เทคนิค",max:10},
  {key:2,name:"จังหวะ",max:20},
  {key:3,name:"อักขระ",max:10},
  {key:4,name:"บุคลิก",max:10},
  {key:5,name:"ความยาก",max:10},
  {key:6,name:"แต่งกาย",max:10}
];

let currentUser = null;
let allRows = [];

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* แยกชื่อเพลงออกจากชื่อผู้ประกวดสำหรับข้อมูลเก่า/ข้อมูลใหม่ */
function getSongName(x){
  const fields = [x?.songName, x?.song, x?.songTitle, x?.เพลง, x?.ชื่อเพลง];
  for(const v of fields){
    const s = String(v ?? "").trim();
    if(s) return s;
  }
  return "-";
}

function getContestantName(x){
  let name = String(x?.name ?? "").trim();
  const no = Number(x?.order ?? 999999);

  // ป้องกัน No. ซ้ำ หากข้อมูลเดิมมี No.X ติดอยู่กับชื่อ
  if(Number.isFinite(no) && no < 999999){
    name = name.replace(new RegExp(`^No\\.\\s*${no}\\s*`, "i"), "").trim();
  }

  // รองรับข้อมูลเก่าที่ชื่อและเพลงคั่นด้วย comma
  const hasSeparateSong = [
    x?.songName, x?.song, x?.songTitle, x?.เพลง, x?.ชื่อเพลง
  ].some(v => String(v ?? "").trim());

  if(!hasSeparateSong && name.includes(",")){
    const parts = name.split(",");
    if(parts.length >= 2) name = parts.slice(0,-1).join(",").trim();
  }

  return name;
}

async function requireSession(){
  const raw = localStorage.getItem(SESSION_KEY);

  if(!raw){
    location.replace("./admin.html");
    return null;
  }

  try{
    const saved = JSON.parse(raw);
    if(!saved?.id || !saved?.username) throw new Error("Invalid session");

    const snap = await getDocs(collection(db,"admins"));
    let current = null;

    snap.forEach(d=>{
      const a = d.data();

      if(
        d.id === saved.id &&
        String(a.username || "").trim().toLowerCase() ===
          String(saved.username || "").trim().toLowerCase() &&
        a.active !== false
      ){
        current = {
          id:d.id,
          username:String(a.username || "").trim(),
          role:String(a.role || "admin").trim().toLowerCase()
        };
      }
    });

    if(!current){
      localStorage.removeItem(SESSION_KEY);
      location.replace("./admin.html");
      return null;
    }

    return current;
  }catch(err){
    console.error(err);
    localStorage.removeItem(SESSION_KEY);
    location.replace("./admin.html");
    return null;
  }
}

function arrScore(arr,index){
  if(!Array.isArray(arr)) return "";
  const n = Number(arr[index]);
  return Number.isFinite(n) ? n : "";
}

function sumArray(arr){
  if(!Array.isArray(arr)) return null;

  return arr.reduce((sum,v)=>{
    const n = Number(v);
    return sum + (Number.isFinite(n) ? n : 0);
  },0);
}

function judgeTotal(c,j){
  const arr = c["score"+j];
  const calculated = sumArray(arr);

  if(calculated !== null) return calculated;
  return Number(c["j"+j] || 0);
}

async function loadContestants(){
  const snap = await getDocs(collection(db,"contestants"));
  const rows = [];

  snap.forEach(d=>{
    const x = d.data();

    rows.push({
      id:d.id,
      order:Number(x.order ?? 999999),
      name:getContestantName(x),
      song:getSongName(x),
      score1:Array.isArray(x.score1) ? x.score1 : [],
      score2:Array.isArray(x.score2) ? x.score2 : [],
      score3:Array.isArray(x.score3) ? x.score3 : [],
      j1:Number(x.j1 ?? 0),
      j2:Number(x.j2 ?? 0),
      j3:Number(x.j3 ?? 0),
      totalScore:Number(x.totalScore ?? 0)
    });
  });

  rows.sort((a,b)=>
    b.totalScore-a.totalScore ||
    a.order-b.order
  );

  return rows;
}

function renderContestant(c,rank){
  const t1=judgeTotal(c,1);
  const t2=judgeTotal(c,2);
  const t3=judgeTotal(c,3);

  /* ✅ แก้ตรงจุด: อันดับ + No.ประจำตัว + ชื่อ + ชื่อเพลง */
  const contestantTitle =
    `อันดับ ${rank}   No.${c.order} ${c.name}, เพลง: ${c.song || "-"}`;

  return `
    <div class="contestant-box">
      <div class="contestant-title">
        <span class="rank">${esc(contestantTitle)}</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>รายการ</th>
            <th>เต็ม</th>
            <th>กรรมการ 1</th>
            <th>กรรมการ 2</th>
            <th>กรรมการ 3</th>
          </tr>
        </thead>
        <tbody>
          ${criteria.map(item=>`
            <tr>
              <td>${esc(item.name)}</td>
              <td>${item.max}</td>
              <td>${esc(arrScore(c.score1,item.key))}</td>
              <td>${esc(arrScore(c.score2,item.key))}</td>
              <td>${esc(arrScore(c.score3,item.key))}</td>
            </tr>
          `).join("")}

          <tr class="judge-total">
            <td>รวม</td>
            <td></td>
            <td>${t1}</td>
            <td>${t2}</td>
            <td>${t3}</td>
          </tr>

          <tr class="grand-total">
            <td colspan="4">รวมทั้งหมด</td>
            <td>${Number(c.totalScore || (t1+t2+t3))}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

function makeExcelRows(){
  const rows=[];

  allRows.forEach((c,idx)=>{
    const t1=judgeTotal(c,1);
    const t2=judgeTotal(c,2);
    const t3=judgeTotal(c,3);

    criteria.forEach(item=>{
      rows.push({
        "อันดับ":idx+1,
        "ผู้ประกวด":`No.${c.order} ${c.name}`,
        "ชื่อเพลง":c.song,
        "รายการคะแนน":item.name,
        "คะแนนเต็ม":item.max,
        "กรรมการ 1":arrScore(c.score1,item.key),
        "กรรมการ 2":arrScore(c.score2,item.key),
        "กรรมการ 3":arrScore(c.score3,item.key)
      });
    });

    rows.push({
      "อันดับ":idx+1,
      "ผู้ประกวด":`No.${c.order} ${c.name}`,
      "ชื่อเพลง":c.song,
      "รายการคะแนน":"รวมกรรมการ",
      "คะแนนเต็ม":"",
      "กรรมการ 1":t1,
      "กรรมการ 2":t2,
      "กรรมการ 3":t3
    });

    rows.push({
      "อันดับ":idx+1,
      "ผู้ประกวด":`No.${c.order} ${c.name}`,
      "ชื่อเพลง":c.song,
      "รายการคะแนน":"รวมทั้งหมด",
      "คะแนนเต็ม":"",
      "กรรมการ 1":"",
      "กรรมการ 2":"",
      "กรรมการ 3":Number(c.totalScore || (t1+t2+t3))
    });
  });

  return rows;
}

async function loadPage(){
  currentUser=await requireSession();
  if(!currentUser) return;

  try{
    allRows=await loadContestants();

    if(!allRows.length){
      document.getElementById("status").textContent="ไม่พบข้อมูลผู้ประกวด";
      document.getElementById("report").innerHTML=
        '<div class="contestant-box">ไม่พบข้อมูลผู้ประกวด</div>';
      return;
    }

    document.getElementById("report").innerHTML=
      allRows.map((c,i)=>renderContestant(c,i+1)).join("");

    document.getElementById("status").textContent=
      `พบผู้ประกวด ${allRows.length} คน • แสดงรายละเอียดคะแนนกรรมการ 1–3 • ขนาดตัวอักษร 14px`;

    document.getElementById("downloadBtn").disabled=false;

  }catch(err){
    console.error(err);
    document.getElementById("status").innerHTML=
      '<span class="error">❌ โหลดข้อมูลไม่ได้: '+esc(err.message)+'</span>';
  }
}

document.getElementById("backBtn").addEventListener("click",()=>{
  location.replace("./admin.html");
});

document.getElementById("logoutBtn").addEventListener("click",()=>{
  localStorage.removeItem(SESSION_KEY);
  location.replace("./admin.html");
});

document.getElementById("downloadBtn").addEventListener("click",()=>{
  if(!allRows.length){
    alert("ไม่พบข้อมูลสำหรับดาวน์โหลด");
    return;
  }

  if(typeof XLSX==="undefined"){
    alert("ไม่สามารถโหลดระบบสร้าง Excel ได้ กรุณาตรวจสอบอินเทอร์เน็ต");
    return;
  }

  const data=makeExcelRows();
  const ws=XLSX.utils.json_to_sheet(data);

  ws["!cols"]=[
    {wch:8},
    {wch:30},
    {wch:25},
    {wch:18},
    {wch:12},
    {wch:14},
    {wch:14},
    {wch:14}
  ];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"รายละเอียดคะแนน");

  XLSX.writeFile(wb,"รายงานผลการประกวดร้องเพลง.xlsx");
});

loadPage();
</script>
</body>
</html>
