<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel</title>
<style>body{font-family:Arial;margin:25px;background:#f5f5f5}.box{background:#fff;padding:20px;border-radius:10px}button{padding:10px 15px;margin:5px;border:0;border-radius:5px;background:#45ad54;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:8px;text-align:center}th{background:#eee}</style></head><body>
<div class="box"><h1>📊 Excel</h1><button onclick="goAdmin()">⬅️ กลับ Admin</button><button onclick="logout()">🚪 Logout</button><button onclick="downloadCSV()">📥 ดาวน์โหลด Excel</button><div id="status">กำลังโหลด...</div><div style="overflow:auto"><table><thead><tr><th>อันดับ</th><th>หมายเลข</th><th>ชื่อ</th><th>คะแนนรวม</th></tr></thead><tbody id="tb"></tbody></table></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const SESSION_KEY="singingContestAdminSession";
async function requireSession(){
 const raw=localStorage.getItem(SESSION_KEY);
 if(!raw){ alert("🔐 กรุณาเข้าสู่ระบบ Admin ก่อน"); location.href="./admin.html"; return false; }
 try{ const s=JSON.parse(raw); if(!s?.id) throw 0; return true; }
 catch(e){ localStorage.removeItem(SESSION_KEY); location.href="./admin.html"; return false; }
}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
window.goAdmin=()=>location.href="./admin.html";
window.logout=()=>{localStorage.removeItem(SESSION_KEY);location.href="./admin.html";};
</script>

<script>
let rows=[];
async function load(){
 if(!await requireSession())return;
 const s=await getDocs(collection(db,"contestants")); rows=[];
 s.forEach(d=>{let x=d.data();rows.push({number:x.order??"",name:x.name??"",score:Number(x.totalScore||0)})});
 rows.sort((a,b)=>b.score-a.score||Number(a.number)-Number(b.number));
 document.getElementById("tb").innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.number)}</td><td>${esc(x.name)}</td><td>${x.score}</td></tr>`).join("");
 document.getElementById("status").textContent=`พบผู้ประกวด ${rows.length} คน`;
}
window.downloadCSV=()=>{if(!rows.length)return alert("ยังไม่มีข้อมูล");let csv="อันดับ,หมายเลข,ชื่อ,คะแนนรวม\n"+rows.map((x,i)=>`${i+1},"${String(x.number).replaceAll('"','""')}","${String(x.name).replaceAll('"','""')}",${x.score}`).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="singing-contest-results.csv";a.click();};
load();
</script></body></html>
