<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor - Singing Contest</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center}
h1{font-size:50px;margin:20px 0 25px}
table{width:90%;margin:auto;border-collapse:collapse;font-size:30px}
td,th{border:1px solid #fff;padding:12px}
th{background:#222}
.gold{background:gold;color:#000;font-weight:bold}
.tie{color:red;text-decoration:underline;font-weight:bold;animation:blinkRed 1s step-start infinite}
@keyframes blinkRed{50%{opacity:.15}}
.hidden{display:none!important}

/* Login */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:360px;background:#fff;color:#111;border-radius:12px;padding:28px 30px;box-shadow:0 8px 30px rgba(255,255,255,.12)}
.login-box h2{margin:0 0 20px}
.login-box input{width:100%;height:44px;margin:7px 0;padding:8px 12px;font-size:16px;border:1px solid #ccc;border-radius:6px}
.login-box button{width:100%;height:44px;margin-top:12px;border:0;border-radius:6px;background:#45ad54;color:#fff;font-size:17px;cursor:pointer}
.login-box button:hover{opacity:.9}
#loginStatus{min-height:22px;margin-top:12px;color:#c00;font-size:14px}
.footer{margin-top:20px;color:#888;font-size:13px}
.monitor-bar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.monitor-bar button{background:#333;color:#fff;border:1px solid #777;border-radius:5px;padding:8px 14px;cursor:pointer}
.user-badge{color:#aaa}
</style>
</head>

<body>

<section id="loginPage">
  <div class="login-box">
    <h2>🔐 Monitor Login</h2>
    <input id="monitorUser" type="text" autocomplete="username" placeholder="Username">
    <input id="monitorPass" type="password" autocomplete="current-password" placeholder="Password">
    <button id="monitorLoginBtn" type="button">เข้าสู่ Monitor</button>
    <div id="loginStatus"></div>
    <div class="footer">Authorized users only</div>
  </div>
</section>

<section id="monitorPage" class="hidden">
  <h1>🏆 ตารางคะแนน</h1>
  <div class="monitor-bar">
    <span class="user-badge" id="monitorUserBadge"></span>
    <button type="button" id="monitorLogoutBtn">🚪 Logout</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>อันดับ</th>
        <th>ชื่อ</th>
        <th>คะแนน</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "...",
  projectId: "singing-contest-85f70"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const MONITOR_SESSION_KEY = "singingContestMonitorSession";
let unsubscribeMonitor = null;

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showLogin(message=""){
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("monitorPage").classList.add("hidden");
  document.getElementById("loginStatus").textContent=message;
}

function showMonitor(username){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("monitorPage").classList.remove("hidden");
  document.getElementById("monitorUserBadge").textContent="ผู้ใช้: "+username;
}

async function verifyMonitorLogin(username,password){
  const snap=await getDocs(collection(db,"admins"));
  let found=null;

  snap.forEach(d=>{
    const a=d.data();
    if(
      String(a.username||"").trim().toLowerCase()===username.toLowerCase() &&
      String(a.password||"")===password &&
      a.active!==false
    ){
      found={
        id:d.id,
        username:String(a.username||"").trim(),
        role:String(a.role||"user").trim().toLowerCase()
      };
    }
  });

  return found;
}

async function verifyMonitorSession(){
  const raw=localStorage.getItem(MONITOR_SESSION_KEY);
  if(!raw){
    showLogin();
    return;
  }

  try{
    const saved=JSON.parse(raw);
    if(!saved?.id || !saved?.username){
      localStorage.removeItem(MONITOR_SESSION_KEY);
      showLogin();
      return;
    }

    const snap=await getDocs(collection(db,"admins"));
    let valid=null;

    snap.forEach(d=>{
      const a=d.data();
      if(
        d.id===saved.id &&
        String(a.username||"").trim().toLowerCase()===String(saved.username).toLowerCase() &&
        a.active!==false
      ){
        valid={
          id:d.id,
          username:String(a.username||"").trim(),
          role:String(a.role||"user").trim().toLowerCase()
        };
      }
    });

    if(!valid){
      localStorage.removeItem(MONITOR_SESSION_KEY);
      showLogin("⛔ Session หมดอายุหรือบัญชีถูกปิดใช้งาน");
      return;
    }

    showMonitor(valid.username);
    startMonitor();
  }catch(err){
    console.error(err);
    localStorage.removeItem(MONITOR_SESSION_KEY);
    showLogin("❌ ไม่สามารถตรวจสอบ Session ได้");
  }
}

async function loginMonitor(){
  const username=document.getElementById("monitorUser").value.trim();
  const password=document.getElementById("monitorPass").value;

  if(!username || !password){
    showLogin("กรุณากรอก Username และ Password");
    return;
  }

  document.getElementById("monitorLoginBtn").disabled=true;
  document.getElementById("loginStatus").textContent="กำลังตรวจสอบ...";

  try{
    const found=await verifyMonitorLogin(username,password);

    if(!found){
      showLogin("❌ Username หรือ Password ไม่ถูกต้อง หรือบัญชีถูกปิดใช้งาน");
      document.getElementById("monitorPass").value="";
      return;
    }

    localStorage.setItem(MONITOR_SESSION_KEY,JSON.stringify(found));
    showMonitor(found.username);
    startMonitor();
  }catch(err){
    console.error(err);
    showLogin("❌ เชื่อมต่อระบบไม่ได้: "+(err?.message||err));
  }finally{
    document.getElementById("monitorLoginBtn").disabled=false;
  }
}

function logoutMonitor(){
  if(unsubscribeMonitor) unsubscribeMonitor();
  unsubscribeMonitor=null;
  localStorage.removeItem(MONITOR_SESSION_KEY);
  document.getElementById("monitorPass").value="";
  showLogin("ออกจาก Monitor แล้ว");
}

function startMonitor(){
  if(unsubscribeMonitor) unsubscribeMonitor();

  unsubscribeMonitor=onSnapshot(collection(db,"contestants"),snap=>{
    const list=[];

    snap.forEach(docSnap=>{
      const d=docSnap.data();
      list.push({
        id:docSnap.id,
        name:String(d.name||""),
        score:Number(d.totalScore||0),
        order:Number(d.order||9999)
      });
    });

    list.sort((a,b)=>{
      if(b.score!==a.score) return b.score-a.score;
      return a.order-b.order;
    });

    const scoreCount={};
    list.forEach(c=>scoreCount[c.score]=(scoreCount[c.score]||0)+1);

    let html="";
    list.forEach((c,i)=>{
      const tie=scoreCount[c.score]>1;
      const cls=(i===0?"gold ":"")+(tie?"tie":"");

      html+=`
        <tr class="${cls}">
          <td>อันดับ ${i+1}</td>
          <td>${escapeHtml(c.name)}</td>
          <td>${c.score}</td>
        </tr>`;
    });

    document.getElementById("tb").innerHTML=html;
  },err=>{
    console.error(err);
    document.getElementById("tb").innerHTML=
      '<tr><td colspan="3">❌ ไม่สามารถโหลดข้อมูลคะแนน</td></tr>';
  });
}

document.getElementById("monitorLoginBtn").addEventListener("click",loginMonitor);
document.getElementById("monitorLogoutBtn").addEventListener("click",logoutMonitor);

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !document.getElementById("loginPage").classList.contains("hidden")){
    loginMonitor();
  }
});

verifyMonitorSession();
</script>
</body>
</html>
